/* ================= FECHAMENTO ================= */
let fcTab = 'dia', fcData = today(), fcMes = today().slice(0, 7);
function caixaDia(d){
  const pags = pagsTodos().filter(x => x.data === d);
  const porForma = [...new Set(pags.map(x => x.forma))].map(fm => { const ps = pags.filter(x => x.forma === fm); return {forma: fm, bruto: sum(ps, x => num(x.valor)), taxa: sum(ps, taxaPag), n: ps.length}; });
  const desp = S.despesas.filter(x => x.data === d), ret = S.retiradas.filter(x => x.data === d);
  const entradasDinheiro = sum(pags.filter(x => x.forma === 'Dinheiro'), x => num(x.valor));
  const saidasDinheiro = sum(desp.filter(x => x.pagoCom === 'Dinheiro do caixa'), x => num(x.valor)) + sum(ret.filter(x => x.pagoCom === 'Dinheiro do caixa'), x => num(x.valor));
  const ant = S.fechamentos.filter(x => x.tipo === 'dia' && x.data < d).sort((a, b) => b.data.localeCompare(a.data))[0];
  return {pags, porForma, desp, ret, entradasDinheiro, saidasDinheiro, inicialSug: ant ? num(ant.contado) : 0, ant, totalEntradas: sum(pags, x => num(x.valor)), totalTaxas: sum(pags, taxaPag)};
}
function fechamento(){
  const tabs = tabsHtml('fc', fcTab, [['dia','Caixa do dia'],['mes','Fechamento do mês'],['hist','Histórico']]);
  if (fcTab === 'hist') {
    const list = [...S.fechamentos].sort((a, b) => (b.fechadoEm || '').localeCompare(a.fechadoEm || ''));
    return `${head('Financeiro', 'Fechamento', '')}${tabs}
    <section class="panel"><div class="rows">${list.map(f => f.tipo === 'dia'
      ? `<div class="row click" data-fcdia="${f.data}"><span class="chip c-acc">Dia</span><div class="grow"><b>${dmyy(f.data)}</b><span>Entradas ${brl(f.totalEntradas)} · dinheiro esperado ${brl(f.esperado)} · contado ${brl(f.contado)}${f.obs ? ' · ' + esc(f.obs) : ''}</span></div>${Math.abs(num(f.diferenca)) < 0.01 ? '<span class="chip c-ok">Bateu</span>' : `<span class="chip ${f.diferenca > 0 ? 'c-warn' : 'c-bad'}">${f.diferenca > 0 ? 'Sobra' : 'Falta'} ${brl(Math.abs(f.diferenca))}</span>`}</div>`
      : `<div class="row click" data-fcmes="${f.mes}"><span class="chip c-ok">Mês</span><div class="grow"><b style="text-transform:capitalize">${mesNome(f.mes)}</b><span>Faturamento ${brl(f.liqRec)} · lucro ${brl(f.lucro)}</span></div><span class="muted small">fechado em ${dmy(dayOf(f.fechadoEm))}</span></div>`).join('') || '<div class="empty">Nenhum fechamento ainda.</div>'}</div></section>`;
  }
  if (fcTab === 'mes') {
    const fx = S.fechamentos.find(x => x.id === 'mes-' + fcMes);
    const dv = divisaoPeriodo(fcMes), f = dv.f;
    const entregSaldo = S.pedidos.filter(p => p.status === 'entregue' && calc(p).saldo > 0.009).length;
    const diasMes = S.fechamentos.filter(x => x.tipo === 'dia' && x.data.startsWith(fcMes)).length;
    const abertos = S.pedidos.filter(p => isVenda(p) && p.status !== 'entregue' && dayOf(p.criadoEm).startsWith(fcMes)).length;
    const check = [[f.desp.length > 0, `${f.desp.length} despesas lançadas no mês`, 'Lance todas as despesas (MEI, material, anúncios) antes de fechar.'],
      [entregSaldo === 0, entregSaldo ? `${entregSaldo} pedido(s) entregue(s) com saldo a receber` : 'Nenhum pedido entregue com saldo pendente', 'Cobre ou registre os pagamentos pendentes.'],
      [diasMes > 0, `${diasMes} caixa(s) diário(s) fechado(s)`, 'Feche o caixa nos dias com venda em dinheiro.'],
      [true, `${abertos} pedido(s) do mês ainda em produção`, 'Eles entram no faturamento do mês em que foram fechados.']];
    return `${head('Financeiro', 'Fechamento', '', mesNav('fcm', fcMes))}${tabs}
    ${fx ? `<div class="banner ok"><p><b>Mês fechado em ${dmyy(dayOf(fx.fechadoEm))}.</b> Os números abaixo são os atuais; o registro guardado está no histórico.</p><button class="btn sm danger" data-act="reabrir-mes">Reabrir mês</button></div>` : ''}
    <div class="kpis">${kpi('Faturamento', brl(f.liqRec), '', 'hl')}${kpi('Lucro líquido', brl(f.lucro), '', '', `color:${f.lucro >= 0 ? 'var(--ok)' : 'var(--bad)'}`)}${kpi('Reserva da empresa', brl(dv.reserva), `${num(cfg().reservaPct)}% do lucro`)}${kpi('A distribuir', brl(dv.dist), `entre ${socios().length} sócio(s)`)}</div>
    <div class="cols">
      <section class="panel"><div class="panel-h"><h2>Conferência antes de fechar</h2></div>
        <div class="rows">${check.map(([ok, t, dica]) => `<div class="row"><span class="chip ${ok ? 'c-ok' : 'c-warn'}">${ok ? 'OK' : 'Ver'}</span><div class="grow"><b style="white-space:normal">${t}</b>${ok ? '' : `<span class="wrap">${dica}</span>`}</div></div>`).join('')}</div>
        ${fx ? '' : `<button class="btn primary" data-act="fechar-mes" style="margin-top:14px">Fechar ${MESES[+fcMes.slice(5) - 1]}</button>`}
      </section>
      <section class="panel"><div class="panel-h"><h2>Resultado</h2><button class="btn ghost sm" data-go="dre">DRE completo</button></div>
        <div class="dre"><div><span>Receita líquida</span><span class="num">${brl(f.liqRec)}</span></div><div><span class="muted">− Custos (CMV)</span><span class="num">${brl(f.cmv)}</span></div><div><span class="muted">− Despesas + pró-labore</span><span class="num">${brl(f.totDesp + f.prolabore)}</span></div><div><span class="muted">− Taxas</span><span class="num">${brl(f.taxas)}</span></div><div><span class="muted">− Juros líquidos</span><span class="num">${brl(f.jurosPagos - f.jurosRecebidos)}</span></div><div class="tot"><span>= Lucro líquido</span><span class="num ${f.lucro >= 0 ? 'pos' : 'neg'}">${brl(f.lucro)}</span></div></div>
        ${dv.ps.length ? `<span class="eyebrow" style="display:block;margin-top:14px">Divisão</span><div class="rows">${dv.ps.map(x => `<div class="row"><div class="grow"><b>${esc(x.s.nome)}</b><span>${num(x.s.pct)}% · já retirou ${brl(x.retirado)}</span></div><span class="num">${brl(x.direito)}</span></div>`).join('')}</div>` : `<p class="hint">Cadastre os sócios em Divisão de lucros para ver quanto cabe a cada um.</p>`}
      </section>
    </div>`;
  }
  const cx = caixaDia(fcData), fx = S.fechamentos.find(x => x.id === 'dia-' + fcData);
  return `${head('Financeiro', 'Fechamento', 'Confira o que entrou e saiu no dia e conte o dinheiro da gaveta.', `<input class="in" type="date" id="fc-data" value="${fcData}" style="max-width:180px">`)}${tabs}
  ${fx ? `<div class="banner ok"><p><b>Caixa de ${dmyy(fcData)} fechado.</b> Contado ${brl(fx.contado)} · ${Math.abs(num(fx.diferenca)) < 0.01 ? 'bateu certinho' : (fx.diferenca > 0 ? 'sobra de ' : 'falta de ') + brl(Math.abs(fx.diferenca))}.</p></div>` : ''}
  <div class="kpis">${kpi('Entradas do dia', brl(cx.totalEntradas), `${cx.pags.length} recebimento(s)`, 'hl')}${kpi('Taxas', brl(cx.totalTaxas), 'cartão, link e boleto')}${kpi('Saídas do dia', brl(sum(cx.desp, x => num(x.valor)) + sum(cx.ret, x => num(x.valor))), 'despesas e retiradas', '', 'color:var(--bad)')}${kpi('Líquido do dia', brl(cx.totalEntradas - cx.totalTaxas - sum(cx.desp, x => num(x.valor))), '')}</div>
  <div class="cols">
    <section class="panel"><div class="panel-h"><h2>Entradas por forma</h2></div>
      ${cx.porForma.length ? `<div class="tbl-wrap"><table><thead><tr><th>Forma</th><th class="r">Qtd</th><th class="r">Bruto</th><th class="r">Taxa</th><th class="r">Líquido</th></tr></thead><tbody>${cx.porForma.map(x => `<tr><td>${esc(x.forma)}</td><td class="r num">${x.n}</td><td class="r num">${brl(x.bruto)}</td><td class="r num neg">${x.taxa ? '− ' + brl(x.taxa) : '—'}</td><td class="r num"><b>${brl(x.bruto - x.taxa)}</b></td></tr>`).join('')}<tr class="tot"><td>Total</td><td class="r num">${cx.pags.length}</td><td class="r num">${brl(cx.totalEntradas)}</td><td class="r num">${brl(cx.totalTaxas)}</td><td class="r num">${brl(cx.totalEntradas - cx.totalTaxas)}</td></tr></tbody></table></div>` : '<div class="empty">Nenhum recebimento neste dia.</div>'}
      <span class="eyebrow" style="display:block;margin-top:14px">Saídas</span>
      <div class="rows">${[...cx.desp.map(d => [d.descricao, d.categoria, d.valor, d.pagoCom]), ...cx.ret.map(r => [socios().find(s => s.id === r.socioId)?.nome || 'Sócio', TIPOS_RET[r.tipo], r.valor, r.pagoCom])].map(([a, b, v, pc]) => `<div class="row"><div class="grow"><b>${esc(a)}</b><span>${esc(b)} · ${esc(pc || PAGO_COM[0])}</span></div><span class="num neg">− ${brl(v)}</span></div>`).join('') || '<div class="empty" style="padding:12px">Nenhuma saída.</div>'}</div>
    </section>
    <section class="panel"><div class="panel-h"><h2>Dinheiro na gaveta</h2></div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <label class="f">Saldo inicial (troco) R$<input class="in" id="fc-ini" inputmode="decimal" value="${dec(fx ? fx.inicial : cx.inicialSug)}"><span class="hint">${cx.ant ? `Sugerido pelo valor contado em ${dmy(cx.ant.data)}.` : 'Quanto havia na gaveta ao abrir.'}</span></label>
        <div class="dre"><div><span>+ Recebido em dinheiro</span><span class="num pos">${brl(cx.entradasDinheiro)}</span></div><div><span>− Pago com dinheiro do caixa</span><span class="num neg">${brl(cx.saidasDinheiro)}</span></div><div class="tot"><span>= Deveria ter</span><span class="num" id="fc-esp"></span></div></div>
        <label class="f">Valor contado R$<input class="in" id="fc-cont" inputmode="decimal" value="${fx ? dec(fx.contado) : ''}" placeholder="Conte as notas e moedas"></label>
        <p id="fc-dif" style="margin:0;font-weight:700"></p>
        <label class="f">Observação<input class="in" id="fc-obs" value="${esc(fx?.obs || '')}" placeholder="Ex.: troco dado errado"></label>
        <button class="btn primary" data-act="fechar-dia">${fx ? 'Refazer fechamento' : 'Fechar caixa do dia'}</button>
      </div>
    </section>
  </div>`;
}
function updCaixa(){
  if (!$('#fc-ini')) return;
  const cx = caixaDia(fcData), esp = num($('#fc-ini').value) + cx.entradasDinheiro - cx.saidasDinheiro, cont = $('#fc-cont').value;
  $('#fc-esp').textContent = brl(esp);
  const dif = num(cont) - esp, el = $('#fc-dif');
  el.textContent = cont === '' ? '' : Math.abs(dif) < 0.01 ? 'Bateu certinho.' : (dif > 0 ? 'Sobra de ' : 'Falta de ') + brl(Math.abs(dif));
  el.style.color = Math.abs(dif) < 0.01 ? 'var(--ok)' : dif > 0 ? 'var(--warn)' : 'var(--bad)';
}

/* ================= EMPRÉSTIMOS ================= */
function emprestimos(){
  const ativos = S.emprestimos.filter(e => !calcEmp(e).quitado), tom = ativos.filter(e => e.tipo !== 'concedido'), conc = ativos.filter(e => e.tipo === 'concedido');
  const mes = today().slice(0, 7);
  const doMes = sum(tom.filter(e => (calcEmp(e).prox || '').startsWith(mes)), e => calcEmp(e).vp);
  const card = e => { const c = calcEmp(e), venc = c.prox && c.prox < today();
    return `<div class="box click" data-emp="${e.id}">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div style="min-width:0"><b>${esc(e.descricao)}</b><div class="muted small">${esc(e.credor || '')}</div></div><span class="chip ${e.tipo === 'concedido' ? 'c-acc' : ''}">${e.tipo === 'concedido' ? 'Emprestei' : 'Peguei'}</span></div>
      <div><span class="eyebrow">${c.quitado ? 'Quitado' : 'Saldo devedor'}</span><div class="big num">${brl(c.saldo)}</div></div>
      <div class="bar"><span style="width:${c.pagasN / c.n * 100}%;${c.quitado ? 'background:var(--ok)' : ''}"></span></div>
      <dl class="kv"><dt>Parcelas</dt><dd class="num">${c.pagasN} de ${c.n} · ${brl(c.vp)}</dd><dt>Juros totais</dt><dd class="num">${brl(c.juros)}</dd>
      ${c.prox ? `<dt>Próxima</dt><dd>${venc ? `<span class="chip c-bad">Venceu ${dmy(c.prox)}</span>` : diffDays(c.prox, today()) <= 7 ? `<span class="chip c-warn">${dmy(c.prox)}</span>` : dmy(c.prox)}</dd>` : ''}</dl>
      ${c.quitado ? '' : `<button class="btn sm ${venc ? 'primary' : ''}" data-act="pagar-parc" data-id="${e.id}">${e.tipo === 'concedido' ? 'Receber' : 'Pagar'} parcela ${c.pagasN + 1}</button>`}
    </div>`; };
  const quit = S.emprestimos.filter(e => calcEmp(e).quitado);
  return `${head('Financeiro', 'Empréstimos', 'Financiamentos de máquinas, empréstimos de banco ou dinheiro que você emprestou. Os juros entram no DRE.', `<button class="btn primary" data-act="edit-emp">${I.novo} Novo empréstimo</button>`)}
  <div class="kpis">${kpi('Total que a empresa deve', brl(sum(tom, e => calcEmp(e).saldo)), `${tom.length} empréstimo(s) ativo(s)`, 'hl')}${kpi('Parcelas deste mês', brl(doMes), 'a pagar')}${kpi('Juros a pagar', brl(sum(tom, e => { const c = calcEmp(e); return c.jurosParc * (c.n - c.pagasN); })), 'ainda nas parcelas futuras', '', 'color:var(--bad)')}${kpi('A receber de terceiros', brl(sum(conc, e => calcEmp(e).saldo)), `${conc.length} empréstimo(s) concedido(s)`)}</div>
  ${ativos.length ? `<div class="cards">${ativos.map(card).join('')}</div>` : `<div class="panel empty">Nenhum empréstimo ativo. Cadastre financiamentos de equipamentos (prensa, impressora, plotter) para controlar as parcelas.</div>`}
  ${quit.length ? `<section class="panel"><div class="panel-h"><h2>Quitados</h2></div><div class="rows">${quit.map(e => `<div class="row click" data-emp="${e.id}"><div class="grow"><b>${esc(e.descricao)}</b><span>${esc(e.credor || '')} · ${calcEmp(e).n}× ${brl(e.valorParcela)}</span></div><span class="chip c-ok">Quitado</span></div>`).join('')}</div></section>` : ''}`;
}
function empModal(id){
  const e = S.emprestimos.find(x => x.id === id) || {tipo:'tomado', descricao:'', credor:'', valor:'', n:12, valorParcela:'', taxa:'', primeiroVenc: addMonthsDate(today(), 1), pagas:[], obs:''};
  const c = id ? calcEmp(e) : null;
  openModal(`<div class="modal-h"><div><span class="eyebrow">Empréstimo</span><h2>${id ? esc(e.descricao) : 'Novo empréstimo'}</h2></div><button class="btn ghost" data-act="close">Fechar</button></div>
  <div class="modal-b">
    <div class="radio-row"><label><input type="radio" name="em-tipo" value="tomado" ${e.tipo !== 'concedido' ? 'checked' : ''}>A empresa pegou emprestado</label><label><input type="radio" name="em-tipo" value="concedido" ${e.tipo === 'concedido' ? 'checked' : ''}>A empresa emprestou</label></div>
    <div class="grid2"><label class="f">Descrição<input class="in" id="em-desc" value="${esc(e.descricao)}" placeholder="Ex.: Financiamento da prensa térmica"></label><label class="f">Banco / pessoa<input class="in" id="em-cred" value="${esc(e.credor)}"></label></div>

    <label class="f">Juros % ao mês<input class="in" id="em-taxa" inputmode="decimal" value="${e.taxa === '' ? '' : String(num(e.taxa)).replace('.', ',')}" placeholder="opcional"></label>

    ${id ? `<div class="sec"><span class="eyebrow">Parcelas</span><div class="tbl-wrap"><table><thead><tr><th>Nº</th><th>Vencimento</th><th class="r">Valor</th><th class="r">Juros</th><th>Situação</th></tr></thead><tbody>
      ${Array.from({length: c.n}, (_, i) => { const pg = (e.pagas || [])[i], v = addMonthsDate(e.primeiroVenc, i); return `<tr><td class="num">${i + 1}</td><td>${dmyy(v)}</td><td class="r num">${brl(c.vp)}</td><td class="r num muted">${brl(c.jurosParc)}</td><td>${pg ? `<span class="chip c-ok">${e.tipo === 'concedido' ? 'Recebida' : 'Paga'} ${dmy(pg.data)}</span>` : v < today() ? '<span class="chip c-bad">Vencida</span>' : '<span class="chip">A vencer</span>'}</td></tr>`; }).join('')}
    </tbody></table></div>${c.pagasN ? `<button class="btn xs" data-act="desfazer-parc" data-id="${id}">Desfazer última parcela</button>` : ''}</div>` : ''}

  <div class="modal-f">${id ? `<button class="btn danger" data-act="del-emp" data-id="${id}">Excluir</button>` : '<span></span>'}<div class="r">${id && !c.quitado ? `<button class="btn" data-act="pagar-parc" data-id="${id}">${e.tipo === 'concedido' ? 'Receber' : 'Pagar'} parcela ${c.pagasN + 1}</button>` : ''}<button class="btn primary" data-act="save-emp" data-id="${id || ''}">Salvar</button></div></div>`);
  updEmpInfo();
}
function updEmpInfo(){
  const el = $('#em-info'); if (!el) return;

  el.textContent = v && n && vp ? `Total ${brl(n * vp)} · juros ${brl(n * vp - v)} (${pctf((n * vp - v) / v * 100)} do valor)` : '';
}

/* ================= DIVISÃO DE LUCROS ================= */
let dvMes = today().slice(0, 7), sociosEdit = null;
function divisao(){
  const c = cfg(), dv = divisaoPeriodo(dvMes);
  if (!sociosEdit) sociosEdit = {list: JSON.parse(JSON.stringify(socios())), reserva: num(c.reservaPct)};
  const somaPct = sum(sociosEdit.list, s => num(s.pct));
  const ano = dvMes.slice(0, 4), retAno = S.retiradas.filter(r => (r.data || '').startsWith(ano));
  return `${head('Financeiro', 'Divisão de lucros', 'Quanto do lucro fica na empresa e quanto cabe a cada sócio.', mesNav('dv', dvMes))}
  <div class="kpis">${kpi('Lucro líquido do mês', brl(dv.f.lucro), `<a href="#" data-go="dre" style="color:inherit">ver DRE</a>`, 'hl')}${kpi(`Reserva da empresa (${num(c.reservaPct)}%)`, brl(dv.reserva), 'capital de giro e reinvestimento')}${kpi('A distribuir', brl(dv.dist), '', '', 'color:var(--ok)')}${kpi('Já retirado no mês', brl(sum(dv.rs.filter(r => r.tipo !== 'prolabore'), r => num(r.valor))), `+ ${brl(sum(dv.rs.filter(r => r.tipo === 'prolabore'), r => num(r.valor)))} de pró-labore`)}</div>
  ${dv.f.lucro < 0 ? `<div class="banner"><p><b>O mês está no prejuízo.</b> Não há lucro para distribuir. Retiradas agora saem do caixa da empresa.</p></div>` : ''}
  ${dv.ps.length ? `<div class="cards">${dv.ps.map(x => `<div class="box"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(x.s.nome)}</b><span class="chip c-acc">${num(x.s.pct)}%</span></div>
    <div><span class="eyebrow">Parte no lucro</span><div class="big num">${brl(x.direito)}</div></div>
    <dl class="kv"><dt>Pró-labore pago</dt><dd class="num">${brl(x.pl)}</dd><dt>Já retirou</dt><dd class="num">${brl(x.retirado)}</dd><dt><b>${x.saldo >= 0 ? 'Ainda pode retirar' : 'Retirou a mais'}</b></dt><dd class="num ${x.saldo >= 0 ? 'pos' : 'neg'}"><b>${brl(Math.abs(x.saldo))}</b></dd></dl></div>`).join('')}</div>` : ''}
  <div class="cols">
    <section class="panel"><div class="panel-h"><h2>Registrar retirada</h2></div>
      ${socios().length ? `<div class="grid3">
        <label class="f">Sócio<select class="in" id="rt-socio">${socios().map(s => `<option value="${s.id}">${esc(s.nome)}</option>`).join('')}</select></label>
        <label class="f">Tipo<select class="in" id="rt-tipo">${Object.entries(TIPOS_RET).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></label>
        <label class="f">Valor R$<input class="in" id="rt-valor" inputmode="decimal" placeholder="0,00"></label></div>
      <div class="grid3" style="margin-top:12px;align-items:end"><label class="f">Data<input class="in" type="date" id="rt-data" value="${dvMes === today().slice(0, 7) ? today() : dvMes + '-28'}"></label>
        <label class="f">Saiu de<select class="in" id="rt-pago">${PAGO_COM.slice(0, 2).map(p => `<option>${p}</option>`).join('')}</select></label>
        <button class="btn primary" data-act="add-ret">Registrar</button></div>
      <p class="hint" style="margin:10px 0 0">Pró-labore é o "salário" do sócio e entra como despesa no DRE. Distribuição de lucro e adiantamento saem da parte de cada um.</p>` : '<p class="muted">Cadastre os sócios ao lado para começar.</p>'}
      <span class="eyebrow" style="display:block;margin-top:16px">Retiradas de ${mesNome(dvMes)}</span>
      <div class="rows">${[...dv.rs].sort((a, b) => b.data.localeCompare(a.data)).map(r => `<div class="row"><span class="mono muted small">${dmy(r.data)}</span><div class="grow"><b>${esc(socios().find(s => s.id === r.socioId)?.nome || 'Sócio removido')}</b><span>${TIPOS_RET[r.tipo]} · ${esc(r.pagoCom || '')}</span></div><span class="num">${brl(r.valor)}</span><button class="btn ghost sm" data-act="del-ret" data-id="${r.id}" aria-label="Excluir retirada">×</button></div>`).join('') || '<div class="empty" style="padding:12px">Nenhuma retirada neste mês.</div>'}</div>
    </section>
    <section class="panel"><div class="panel-h"><h2>Sócios e reserva</h2></div>
      <div id="soc-list">${sociosTable()}</div>
      <div class="grid2" style="margin-top:12px;align-items:end"><label class="f">Reserva da empresa (% do lucro)<input class="in" id="soc-res" type="number" min="0" max="100" value="${sociosEdit.reserva}"></label><button class="btn sm" data-act="add-socio">${I.novo} Adicionar sócio</button></div>
      <p class="hint" id="soc-hint" style="margin:10px 0">${Math.abs(somaPct - 100) < 0.01 || !sociosEdit.list.length ? '' : `Os percentuais somam ${somaPct}%. O ideal é 100%.`}</p>
      <button class="btn primary" data-act="save-socios">Salvar sócios</button>
      <span class="eyebrow" style="display:block;margin-top:18px">Retirado em ${ano}</span>
      <div class="rows">${socios().map(s => { const rs = retAno.filter(r => r.socioId === s.id); return `<div class="row"><div class="grow"><b>${esc(s.nome)}</b><span>pró-labore ${brl(sum(rs.filter(r => r.tipo === 'prolabore'), r => num(r.valor)))} · lucros ${brl(sum(rs.filter(r => r.tipo !== 'prolabore'), r => num(r.valor)))}</span></div><span class="num">${brl(sum(rs, r => num(r.valor)))}</span></div>`; }).join('') || '<div class="empty" style="padding:12px">—</div>'}</div>
    </section>
  </div>`;
}
function sociosTable(){
  return sociosEdit.list.length ? `<div class="rows">${sociosEdit.list.map((s, i) => `<div class="row" style="gap:8px"><input class="in" data-soc="${i}" data-k="nome" value="${esc(s.nome)}" placeholder="Nome" aria-label="Nome do sócio"><input class="in num" data-soc="${i}" data-k="pct" type="number" min="0" max="100" value="${num(s.pct)}" style="width:84px" aria-label="Percentual"><span class="muted">%</span><button class="btn ghost sm" data-act="del-socio" data-i="${i}" aria-label="Remover sócio">×</button></div>`).join('')}</div>` : '<p class="muted small" style="margin:0">Nenhum sócio cadastrado.</p>';
}

/* ================= DRE ================= */
let dreModo = 'mes', dreMes = today().slice(0, 7), dreAno = today().slice(0, 4);
function dreLinhas(f, cats){
  const L = [['Receita bruta de vendas', f.bruta, 'main'], ['(−) Descontos concedidos', -f.desc, 'subl'], ['(=) Receita líquida', f.liqRec, 'tot'],
    ['(−) Custo dos produtos e serviços (CMV)', -f.cmv, 'subl'], ['(=) Lucro bruto', f.lucroBruto, 'tot']];
  (cats || CAT_DESP.filter(c => f.despCat[c])).forEach(c => L.push(['(−) ' + c, -(f.despCat[c] || 0), 'subl']));
  L.push(['(−) Pró-labore dos sócios', -f.prolabore, 'subl'], ['(−) Taxas de cartão, link e boleto', -f.taxas, 'subl'], ['(=) Resultado operacional', f.operacional, 'tot'],
    ['(−) Juros de empréstimos', -f.jurosPagos, 'subl'], ['(+) Juros recebidos', f.jurosRecebidos, 'subl'], ['(=) Lucro líquido', f.lucro, 'fin']);
  return L;
}
function dre(){
  const seg = `<div class="seg"><button data-dre="mes" aria-pressed="${dreModo === 'mes'}">Mensal</button><button data-dre="ano" aria-pressed="${dreModo === 'ano'}">Anual</button></div>`;
  if (dreModo === 'ano') {
    const meses = Array.from({length: 12}, (_, i) => dreAno + '-' + pad(i + 1)), fs = meses.map(finPeriodo), fa = finPeriodo(dreAno);
    const cats = CAT_DESP.filter(c => fa.despCat[c]);
    const linhas = dreLinhas(fa, cats).map((l, i) => [l, fs.map(f => dreLinhas(f, cats)[i][1])]);
    return `${head('Financeiro', 'DRE', 'Demonstrativo do resultado: de quanto você vendeu até quanto sobrou.', `<div class="toolbar">${seg}<button class="btn" data-dano="-1" aria-label="Ano anterior">‹</button><b>${dreAno}</b><button class="btn" data-dano="1" aria-label="Próximo ano">›</button><button class="btn sm" data-act="exp-dre">${I.down} Planilha</button></div>`)}
    <section class="panel"><div class="panel-h"><h2>Lucro líquido por mês</h2><span class="num small">${brl(fa.lucro)} no ano</span></div>${chart(meses.map(m => MESES[+m.slice(5) - 1].slice(0, 3)), fs.map(f => f.lucro), 1, true)}</section>
    <div class="tbl-wrap"><table><thead><tr><th style="position:sticky;left:0;background:var(--surface-2)">Conta</th>${meses.map(m => `<th class="r">${MESES[+m.slice(5) - 1].slice(0, 3)}</th>`).join('')}<th class="r">Total</th></tr></thead><tbody>
      ${linhas.map(([[label, tot, k], vals]) => `<tr class="${k === 'tot' ? 'tot' : k === 'fin' ? 'fin' : k === 'subl' ? 'subl' : ''}"><td style="position:sticky;left:0;background:${k === 'fin' ? 'var(--accent-soft)' : k === 'tot' ? 'var(--surface-2)' : 'var(--surface)'}">${label}</td>${vals.map(v => `<td class="r num ${v < 0 ? 'neg' : ''}">${v ? brl(v) : '—'}</td>`).join('')}<td class="r num ${tot < 0 ? 'neg' : ''}"><b>${brl(tot)}</b></td></tr>`).join('')}
    </tbody></table></div>`;
  }
  const f = finPeriodo(dreMes), fp = finPeriodo(addMonths(dreMes, -1));
  const L = dreLinhas(f), LP = dreLinhas(fp, CAT_DESP.filter(c => f.despCat[c]));
  const base = f.liqRec || 1;
  return `${head('Financeiro', 'DRE', 'Demonstrativo do resultado: de quanto você vendeu até quanto sobrou.', `<div class="toolbar">${seg}${mesNav('dre', dreMes)}<button class="btn sm" data-act="exp-dre">${I.down} Planilha</button></div>`)}
  <div class="kpis">${kpi('Receita líquida', brl(f.liqRec), `${f.vendas.length} pedidos`, 'hl')}${kpi('Margem bruta', pctf(f.lucroBruto / base * 100), brl(f.lucroBruto))}${kpi('Margem operacional', pctf(f.operacional / base * 100), brl(f.operacional))}${kpi('Margem líquida', pctf(f.lucro / base * 100), brl(f.lucro), '', `color:${f.lucro >= 0 ? 'var(--ok)' : 'var(--bad)'}`)}</div>
  <div class="tbl-wrap"><table><thead><tr><th>Conta</th><th class="r">${MESES[+dreMes.slice(5) - 1]}</th><th class="r">% da receita</th><th class="r">Mês anterior</th><th class="r">Variação</th></tr></thead><tbody>
    ${L.map(([label, v, k], i) => { const pv = LP[i]?.[1] || 0, dlt = v - pv; return `<tr class="${k === 'tot' ? 'tot' : k === 'fin' ? 'fin' : k === 'subl' ? 'subl' : ''}"><td>${label}</td><td class="r num ${v < 0 ? 'neg' : ''}">${brl(v)}</td><td class="r num muted">${f.liqRec ? pctf(v / base * 100) : '—'}</td><td class="r num muted">${brl(pv)}</td><td class="r num ${dlt > 0.009 ? 'pos' : dlt < -0.009 ? 'neg' : 'muted'}">${Math.abs(dlt) < 0.01 ? '—' : (dlt > 0 ? '+' : '') + brl(dlt)}</td></tr>`; }).join('')}
  </tbody></table></div>
  <p class="hint" style="margin:0">Regime de competência: a venda conta no mês em que o pedido foi fechado, mesmo que o pagamento venha depois. Taxas e juros contam no mês do pagamento. Distribuição de lucro não entra no DRE; pró-labore entra.</p>`;
}

/* ================= RELATÓRIOS ================= */
let relPer = 'mes';
const PERIODOS = {mes:'Este mês', mesant:'Mês passado', d90:'Últimos 90 dias', ano:'Este ano', tudo:'Tudo'};
function rangeRel(){
  const t = today(), m = t.slice(0, 7);
  return relPer === 'mes' ? [m + '-01', t] : relPer === 'mesant' ? [addMonths(m, -1) + '-01', addDays(m + '-01', -1)] : relPer === 'd90' ? [addDays(t, -89), t] : relPer === 'ano' ? [t.slice(0, 4) + '-01-01', t] : ['0000', '9999'];
}
function relatorio(){
  const [ini, fim] = rangeRel(), inR = d => d >= ini && d <= fim;
  const vendas = S.pedidos.filter(p => isVenda(p) && inR(dayOf(p.criadoEm)));
  const fat = sum(vendas, p => calc(p).total), lucroB = sum(vendas, p => calc(p).total - calc(p).custo);
  const orcs = S.pedidos.filter(p => inR(dayOf(p.criadoEm)) && p.historico?.[0]?.st === 'orcamento');
  const convOrc = orcs.length ? orcs.filter(isVenda).length / orcs.length * 100 : 0;
  const cliIds = [...new Set(vendas.map(p => p.clienteId))];
  const novos = cliIds.filter(id => { const first = S.pedidos.filter(p => p.clienteId === id && isVenda(p)).map(p => dayOf(p.criadoEm)).sort()[0]; return first && inR(first); }).length;
  const itens = {}; vendas.forEach(p => p.itens.forEach(it => { const k = it.produtoId || it.nome; const o = itens[k] = itens[k] || {nome: it.nome, serv: isServ(produto(it.produtoId)), q: 0, r: 0, l: 0}; o.q += it.qtd; o.r += it.qtd * it.preco; o.l += it.qtd * (it.preco - (it.custo || 0)); }));
  const topItens = Object.values(itens).sort((a, b) => b.r - a.r).slice(0, 12);
  const porCat = {}; vendas.forEach(p => p.itens.forEach(it => { const pr = produto(it.produtoId); const c = isServ(pr) ? 'Serviços' : pr?.categoria || 'Outros'; porCat[c] = (porCat[c] || 0) + it.qtd * it.preco; }));
  const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
  const topC = cliIds.map(id => ({id, nome: cliente(id)?.nome || 'Cliente removido', n: vendas.filter(p => p.clienteId === id).length, t: sum(vendas.filter(p => p.clienteId === id), p => calc(p).total)})).sort((a, b) => b.t - a.t).slice(0, 8);
  const pags = pagsTodos().filter(x => inR(x.data || ''));
  const porForma = [...new Set(pags.map(x => x.forma))].map(f => [f, sum(pags.filter(x => x.forma === f), x => num(x.valor))]).sort((a, b) => b[1] - a[1]);
  const leads = S.leads.filter(l => inR(dayOf(l.criadoEm)));
  const porOrig = ORIGENS.map(o => { const ls = leads.filter(l => l.origem === o); return [o, ls.length, ls.filter(l => l.etapa === 'ganho').length]; }).filter(x => x[1]).sort((a, b) => b[1] - a[1]);
  const atts = S.atendimentos.filter(a => inR(dayOf(a.data)));
  const meses = Array.from({length: 12}, (_, i) => addMonths(today().slice(0, 7), i - 11));
  const vm = meses.map(m => sum(S.pedidos.filter(p => isVenda(p) && dayOf(p.criadoEm).startsWith(m)), p => calc(p).total));
  return `${head('Financeiro', 'Relatórios', `${relPer === 'tudo' ? 'Todo o período' : dmyy(ini) + ' a ' + dmyy(fim)}`, `<div class="seg">${Object.entries(PERIODOS).map(([k, l]) => `<button data-rel="${k}" aria-pressed="${relPer === k}">${l}</button>`).join('')}</div>`)}
  <div class="kpis">${kpi('Faturamento', brl(fat), `${vendas.length} pedidos · ticket ${brl(vendas.length ? fat / vendas.length : 0)}`, 'hl')}${kpi('Lucro bruto', brl(lucroB), `margem ${fat ? pctf(lucroB / fat * 100) : '0%'}`)}${kpi('Clientes atendidos', cliIds.length, `${novos} novo(s) · ${cliIds.length - novos} recorrente(s)`)}${kpi('Orçamentos aprovados', convOrc.toFixed(0) + '%', `${orcs.filter(isVenda).length} de ${orcs.length} orçamentos`)}</div>
  <section class="panel"><div class="panel-h"><h2>Vendas dos últimos 12 meses</h2><span class="muted num small">${brl(sum(vm, x => x))}</span></div>${chart(meses.map(m => MESES[+m.slice(5) - 1].slice(0, 3)), vm, 1)}</section>
  <section class="panel"><div class="panel-h"><h2>Produtos e serviços que mais faturaram</h2></div>
    ${topItens.length ? `<div class="tbl-wrap"><table><thead><tr><th>Item</th><th class="r">Qtd</th><th class="r">Receita</th><th class="r">Lucro bruto</th><th class="r">Margem</th></tr></thead><tbody>${topItens.map(x => `<tr><td><b>${esc(x.nome)}</b>${x.serv ? ' <span class="chip c-acc">serviço</span>' : ''}</td><td class="r num">${x.q}</td><td class="r num">${brl(x.r)}</td><td class="r num">${brl(x.l)}</td><td class="r num">${x.r ? pctf(x.l / x.r * 100) : '—'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Sem vendas no período.</div>'}</section>
  <div class="cols three">
    <section class="panel"><div class="panel-h"><h2>Por categoria</h2></div><div class="rows">${cats.map(([c, v]) => barRow(esc(c), `<b class="num">${brl(v)}</b>`, v / cats[0][1])).join('') || '<div class="empty">—</div>'}</div></section>
    <section class="panel"><div class="panel-h"><h2>Melhores clientes</h2></div><div class="rows">${topC.map((x, i) => `<div class="row click" data-cli="${x.id}"><span class="mono muted">${i + 1}º</span><div class="grow"><b>${esc(x.nome)}</b><span>${x.n} pedido(s)</span></div><span class="num">${brl(x.t)}</span></div>`).join('') || '<div class="empty">—</div>'}</div></section>
    <section class="panel"><div class="panel-h"><h2>Formas de pagamento</h2></div><div class="rows">${porForma.map(([f, v]) => barRow(esc(f), `<b class="num">${brl(v)}</b>`, v / porForma[0][1])).join('') || '<div class="empty">—</div>'}</div></section>
  </div>
  <div class="cols even">
    <section class="panel"><div class="panel-h"><h2>CRM: contatos por origem</h2><span class="muted small">${leads.length} contato(s) no período</span></div><div class="rows">${porOrig.map(([o, n, g]) => barRow(`${esc(o)} <span class="muted small">· ${g} fechou (${(g / n * 100).toFixed(0)}%)</span>`, `<b class="num">${n}</b>`, n / porOrig[0][1])).join('') || '<div class="empty">—</div>'}</div></section>

function renderSim(){

}

async function impBackup(file){
  try {
    const data = JSON.parse(await file.text());

    let n = 0;
    for (const col of COLS) for (const o of (data[col] || [])) if (o && typeof o.id === 'string' && /^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(o.id)) { await save(col, o, true); n++; }

async function act(a, d, btn, ev){

    case 'sair': if (window.rfAuth) await window.rfAuth.sair(); break;
    case 'more': moreOpen = !moreOpen; renderNav(); break;
    case 'go-insumos': prodTab = 'insumos'; go('produtos'); break;
    case 'ver-cancelados': pedView = 'lista'; pedFiltro = 'cancelado'; go('pedidos'); break;
    case 'ver-atrasados': pedView = 'lista'; pedFiltro = 'atrasados'; go('pedidos'); break;
    case 'ver-orcamentos': pedView = 'lista'; pedFiltro = 'orcamento'; go('pedidos'); break;
    case 'ver-retornos': attFiltro = 'atrasados'; if (!S.atendimentos.some(x => x.status === 'aberto' && x.retorno && x.retorno < today())) attFiltro = 'hoje'; go('atendimentos'); break;
    case 'campanha-data': msgModelo = 'b8'; msgPublico = 'todos'; go('mensagens'); break;
    case 'load-samples': btn.disabled = true; await loadSamples(); break;
    case 'clear-samples': arm(btn, () => clearSamples()); break;

    /* pedidos */
    case 'approve': { const p = P(d.id); await savePedido({...p, status:'aprovado'}); toast(`Pedido #${p.numero} aprovado`); break; }
    case 'advance': { const p = P(d.id), nx = STATUS[STATUS.findIndex(x => x.k === p.status) + 1]; if (nx) { await savePedido({...p, status:nx.k}); toast(`#${p.numero} → ${nx.l}`); } break; }
    case 'set-status': { const p = P(d.id); if (p.status === d.st) break; await savePedido(keep({...p, status:d.st})); pedidoModal(p.id); toast(`#${p.numero} → ${ST[d.st]}`); break; }
    case 'save-pedido': { await savePedido(keep(P(d.id))); closeModal(); toast('Pedido salvo'); break; }
    case 'add-pag': { const p = P(d.id), v = num($('#pg-valor').value); if (v <= 0) { toast('Informe um valor maior que zero.'); break; }
      const forma = $('#pg-forma').value, parcelas = $('#pg-parc-w').hidden ? 1 : (+$('#pg-parc').value || 1);
      await savePedido(keep({...p, pagamentos:[...(p.pagamentos || []), {valor:v, forma, parcelas, taxa:taxaDe(forma, v, parcelas), data:today()}]})); pedidoModal(p.id); toast(`Recebido ${brl(v)}`); break; }
    case 'del-pag': { const p = P(d.id); await savePedido(keep({...p, pagamentos:p.pagamentos.filter((_, i) => i !== +d.i)})); pedidoModal(p.id); break; }
    case 'del-pedido': arm(btn, async () => { const p = P(d.id); if (isVenda(p)) await savePedido({...p, status:'cancelado'}); await remove('pedidos', d.id); closeModal(); toast('Pedido excluído'); }); break;
    case 'dup-pedido': { const p = P(d.id); cart = {...newCart(), clienteId:p.clienteId, itens:p.itens.map(i => ({...i})), frete: num(p.frete) ? dec(p.frete) : ''}; closeModal(); go('novo'); toast('Itens copiados. Ajuste e salve.'); break; }
    case 'edit-itens': { const p = P(d.id); cart = {...newCart(), editId:p.id, clienteId:p.clienteId, itens:p.itens.map(i => ({...i})), entrega:p.entrega || '', desconto: num(p.desconto) ? dec(p.desconto) : '', frete: num(p.frete) ? dec(p.frete) : '', obs:p.obs || '', status:p.status}; closeModal(); go('novo'); break; }
    case 'cancel-edit': cart = newCart(); render(); break;
    case 'del-arte': { ev.preventDefault(); ev.stopPropagation(); arm(btn, async () => { const p = P(d.id), ar = p.artes[+d.i];
      await save('pedidos', {...p, artes: p.artes.filter((_, i) => i !== +d.i)});
      try { if (assets && ar) await assets.delete(ar.id); } catch (e) {}
      pedidoModal(p.id); toast('Arte removida'); }); break; }
    case 'copy-msg': copy($('#msg-text').value, '#msg-text'); break;
    case 'comprovante': { const p = P(d.id); saveFile(`${p.status === 'orcamento' ? 'orcamento' : 'pedido'}-${p.numero}.html`, comprovante(p, (await logoDataUrl()) || LOGO_H_URI)); break; }

    /* PDV */
    case 'clear-cart': cart = newCart(); renderCart(); break;
    case 'sinal-pct': { const c = cartTotals(); cart.sinal = dec(c.total * num(cfg().sinalPct) / 100); $('#c-sinal').value = cart.sinal; updTotals(); break; }
    case 'copy-cart': copy(mensagem('resumo', cartToPedido())); break;
    case 'save-cart': {
      if (!cart.clienteId) { toast('Escolha o cliente antes de salvar.'); $('#c-cliente').focus(); break; }
      const ed = !!cart.editId;
      const p = await savePedido(cartToPedido());
      cart = newCart();
      if (ed) { go('pedidos'); pedidoModal(p.id); toast(`Pedido #${p.numero} atualizado`); }
      else { renderCart(); toast(`${p.status === 'orcamento' ? 'Orçamento' : 'Pedido'} #${p.numero} salvo`); pedidoModal(p.id); }
      break; }

    /* produtos e serviços */
    case 'edit-produto': produtoModal(d.id); break;
    case 'edit-servico': produtoModal(null, 'servico'); break;
    case 'sugerir-preco': { const c = num($('#fp-custo').value); if (!c) { toast('Informe o custo primeiro.'); break; } const v = c / 0.4; let r = Math.ceil(v) - 0.1; if (r < v) r += 1; $('#fp-preco').value = dec(r); $('#f-prod').dispatchEvent(new Event('input')); break; }
    case 'save-produto': {
      const nome = $('#fp-nome').value.trim(); if (!nome) { toast('Dê um nome.'); $('#fp-nome').focus(); break; }
      const old = S.produtos.find(x => x.id === d.id) || {}, tipo = $('#f-prod').dataset.tipo;
      const o = {...old, id: d.id || uid(), tipo, nome, categoria:$('#fp-cat').value.trim(), custo:num($('#fp-custo').value), preco:num($('#fp-preco').value), prazoDias:num($('#fp-prazo').value)};
      if (tipo === 'servico') o.horas = num($('#fp-horas').value); else o.estoque = num($('#fp-est').value);
      await save('produtos', o); closeModal(); toast(tipo === 'servico' ? 'Serviço salvo' : 'Produto salvo'); break; }
    case 'del-produto': arm(btn, async () => { await remove('produtos', d.id); closeModal(); toast('Excluído'); }); break;
    case 'edit-insumo': insumoModal(d.id); break;
    case 'save-insumo': {
      const nome = $('#fi-nome').value.trim(); if (!nome) { toast('Dê um nome ao insumo.'); $('#fi-nome').focus(); break; }
      const old = S.insumos.find(x => x.id === d.id) || {};
      await save('insumos', {...old, id: d.id || uid(), nome, unidade:$('#fi-un').value.trim(), qtd:num($('#fi-qtd').value), minimo:num($('#fi-min').value), custo:num($('#fi-custo').value)});
      closeModal(); toast('Insumo salvo'); break; }
    case 'del-insumo': arm(btn, async () => { await remove('insumos', d.id); closeModal(); toast('Insumo excluído'); }); break;
    case 'ins-q': { const i = S.insumos.find(x => x.id === d.id); await save('insumos', {...i, qtd: Math.max(0, num(i.qtd) + +d.d)}); break; }

    /* clientes */
    case 'edit-cliente': clienteModal(d.id, d.quick); break;
    case 'novo-para': cart = {...newCart(), clienteId: d.id}; closeModal(); go('novo'); break;
    case 'save-cliente': {
      const nome = $('#fc-nome').value.trim(); if (!nome) { toast('Informe o nome do cliente.'); $('#fc-nome').focus(); break; }
      const av = $('#fc-aniv').value.trim().match(/^(\d{1,2})\/(\d{1,2})$/);
      if ($('#fc-aniv').value.trim() && !av) { toast('Aniversário no formato dia/mês, ex.: 25/12.'); $('#fc-aniv').focus(); break; }
      const old = S.clientes.find(x => x.id === d.id) || {criadoEm: new Date().toISOString()};
      const c = {...old, id: d.id || uid(), nome, segmento:$('#fc-seg').value, whatsapp:$('#fc-wa').value.trim(), cidade:$('#fc-cid').value.trim(), obs:$('#fc-obs').value.trim(), endereco:$('#fc-end').value.trim(), aniversario: av ? pad(av[2]) + '-' + pad(av[1]) : ''};
      await save('clientes', c); closeModal(); toast('Cliente salvo');
      if (d.quick && cart) { cart.clienteId = c.id; renderClienteSelect(); }
      break; }
    case 'del-cliente': arm(btn, async () => { await remove('clientes', d.id); closeModal(); toast('Cliente excluído'); }); break;

    /* CRM */
    case 'edit-lead': leadModal(d.id); break;
    case 'save-lead': { const l = leadFromForm(d.id); if (!l.nome) { toast('Informe o nome.'); $('#fl-nome').focus(); break; } await save('leads', l); closeModal(); toast('Contato salvo'); break; }
    case 'lead-etapa': { const l = {...leadFromForm(d.id), etapa: d.et}; if (d.et === 'ganho') { await leadGanho(l); break; } if (d.et === 'perdido' && !l.motivo) l.motivo = MOTIVOS[0]; await save('leads', l); leadModal(l.id); break; }
    case 'lead-adv': { const l = S.leads.find(x => x.id === d.id), nx = ETAPAS[ETAPAS.findIndex(x => x.k === l.etapa) + 1]; await save('leads', {...l, etapa: nx.k, atualizadoEm: new Date().toISOString(), proximo: l.proximo && l.proximo > today() ? l.proximo : addDays(today(), 2)}); toast(`${primeiroNome(l.nome)} → ${nx.l}`); break; }
    case 'lead-ganho': { const l = $('#fl-nome') ? leadFromForm(d.id) : S.leads.find(x => x.id === d.id); await leadGanho(l); break; }
    case 'lead-perdido': { const l = leadFromForm(d.id); await save('leads', {...l, etapa:'perdido', motivo: l.motivo || MOTIVOS[0], proximo:''}); leadModal(l.id); toast('Marcado como perdido. Escolha o motivo e salve.'); break; }
    case 'del-lead': arm(btn, async () => { await remove('leads', d.id); closeModal(); toast('Contato excluído'); }); break;

    /* atendimentos */
    case 'novo-att': attModal(null, {clienteId: d.cli || '', leadId: d.lead || ''}); break;
    case 'add-att': {
      const ref = pessoaRef($('#at-pessoa').value), nome = $('#at-nome').value.trim(), desc = $('#at-desc').value.trim();
      if (!ref.clienteId && !ref.leadId && !nome) { toast('Escolha a pessoa ou digite o nome.'); break; }
      await save('atendimentos', {id: uid(), ...ref, nome, canal: $('#at-canal').value, assunto: $('#at-assunto').value, descricao: desc, retorno: $('#at-ret').value, status: d.st, data: new Date().toISOString()}, true);
      render(); toast('Atendimento registrado'); break; }
    case 'save-att': {
      const ref = pessoaRef($('#am-pessoa').value), nome = $('#am-nome').value.trim();
      if (!ref.clienteId && !ref.leadId && !nome) { toast('Escolha a pessoa ou digite o nome.'); break; }
      const old = S.atendimentos.find(x => x.id === d.id) || {data: new Date().toISOString()};
      await save('atendimentos', {...old, id: d.id || uid(), ...ref, nome, canal: $('#am-canal').value, assunto: $('#am-assunto').value, descricao: $('#am-desc').value.trim(), retorno: $('#am-ret').value, status: document.querySelector('input[name="am-st"]:checked').value});
      closeModal(); toast('Atendimento salvo'); break; }
    case 'att-ok': { const x = S.atendimentos.find(y => y.id === d.id); await save('atendimentos', {...x, status:'resolvido'}); toast('Resolvido'); break; }
    case 'del-att': arm(btn, async () => { await remove('atendimentos', d.id); closeModal(); toast('Atendimento excluído'); }); break;

    /* mensagens */
    case 'edit-modelo': modeloModal(d.id); break;
    case 'dup-modelo': { const m = modeloPor(d.id); modeloModal(null, {titulo: m.titulo + ' (meu)', cat: m.cat, texto: m.texto}); break; }
    case 'save-modelo': { const tit = $('#mm-tit').value.trim(), txt = $('#mm-txt').value.trim(); if (!tit || !txt) { toast('Preencha título e texto.'); break; }
      const id = d.id || 'm' + uid(); await save('modelos', {id, titulo: tit, cat: $('#mm-cat').value.trim() || 'Geral', texto: txt}, true); msgModelo = id; closeModal(); go('mensagens'); toast('Modelo salvo'); break; }
    case 'del-modelo': arm(btn, async () => { await remove('modelos', d.id, true); msgModelo = 'b1'; closeModal(); render(); toast('Modelo excluído'); }); break;

    /* despesas */
    case 'add-desp': {
      const desc = $('#dp-desc').value.trim(), v = num($('#dp-valor').value);
      if (!desc || v <= 0) { toast('Preencha descrição e valor.'); break; }
      await save('despesas', {id: uid(), descricao: desc, categoria: $('#dp-cat').value, valor: v, data: $('#dp-data').value || today(), pagoCom: $('#dp-pago').value}, true);
      render(); toast('Despesa lançada'); break; }
    case 'del-desp': arm(btn, async () => { await remove('despesas', d.id); toast('Despesa excluída'); }); break;

    /* fechamento */
    case 'fechar-dia': {
      const cx = caixaDia(fcData), ini = num($('#fc-ini').value), cont = $('#fc-cont').value;
      if (cont === '') { toast('Conte o dinheiro da gaveta e informe o valor.'); $('#fc-cont').focus(); break; }
      const esp = ini + cx.entradasDinheiro - cx.saidasDinheiro;
      await save('fechamentos', {id: 'dia-' + fcData, tipo:'dia', data: fcData, inicial: ini, entradasDinheiro: cx.entradasDinheiro, saidasDinheiro: cx.saidasDinheiro, esperado: esp, contado: num(cont), diferenca: num(cont) - esp,
        totalEntradas: cx.totalEntradas, totalTaxas: cx.totalTaxas, porForma: cx.porForma, obs: $('#fc-obs').value.trim(), fechadoEm: new Date().toISOString()}, true);
      render(); toast('Caixa do dia fechado'); break; }
    case 'fechar-mes': {
      const dv = divisaoPeriodo(fcMes), f = dv.f;
      await save('fechamentos', {id: 'mes-' + fcMes, tipo:'mes', mes: fcMes, bruta: f.bruta, desc: f.desc, liqRec: f.liqRec, cmv: f.cmv, totDesp: f.totDesp, prolabore: f.prolabore, taxas: f.taxas, jurosPagos: f.jurosPagos, lucro: f.lucro,
        reserva: dv.reserva, distribuir: dv.dist, divisao: dv.ps.map(x => ({nome: x.s.nome, pct: x.s.pct, direito: x.direito, retirado: x.retirado})), fechadoEm: new Date().toISOString()}, true);
      render(); toast(`${mesNome(fcMes)} fechado`); break; }
    case 'reabrir-mes': arm(btn, async () => { await remove('fechamentos', 'mes-' + fcMes); toast('Mês reaberto'); }); break;

    /* empréstimos */
    case 'edit-emp': empModal(d.id); break;
    case 'calc-parc': { const v = num($('#em-valor').value), n = num($('#em-n').value), i = num($('#em-taxa').value) / 100;
      if (!v || !n) { toast('Informe valor e número de parcelas.'); break; }
      const pmt = i ? v * i / (1 - Math.pow(1 + i, -n)) : v / n; $('#em-vp').value = dec(Math.round(pmt * 100) / 100); updEmpInfo(); break; }
    case 'save-emp': {
      const desc = $('#em-desc').value.trim(), v = num($('#em-valor').value), n = Math.round(num($('#em-n').value)), vp = num($('#em-vp').value);
      if (!desc || !v || !n || !vp) { toast('Preencha descrição, valor, parcelas e valor da parcela.'); break; }
      const old = S.emprestimos.find(x => x.id === d.id) || {pagas: [], criadoEm: new Date().toISOString()};
      await save('emprestimos', {...old, id: d.id || uid(), tipo: document.querySelector('input[name="em-tipo"]:checked').value, descricao: desc, credor: $('#em-cred').value.trim(), valor: v, n, valorParcela: vp, taxa: num($('#em-taxa').value), primeiroVenc: $('#em-venc').value || today(), obs: $('#em-obs').value.trim()});
      closeModal(); toast('Empréstimo salvo'); break; }
    case 'pagar-parc': { const e = S.emprestimos.find(x => x.id === d.id), c = calcEmp(e); if (c.quitado) break;
      await save('emprestimos', {...e, pagas: [...(e.pagas || []), {n: c.pagasN + 1, data: today()}]}); if ($('#modal-root').innerHTML) empModal(e.id);
      toast(`Parcela ${c.pagasN + 1} de ${c.n} ${e.tipo === 'concedido' ? 'recebida' : 'paga'}`); break; }
    case 'desfazer-parc': { const e = S.emprestimos.find(x => x.id === d.id); await save('emprestimos', {...e, pagas: (e.pagas || []).slice(0, -1)}); empModal(e.id); break; }
    case 'del-emp': arm(btn, async () => { await remove('emprestimos', d.id); closeModal(); toast('Empréstimo excluído'); }); break;

    /* divisão */
    case 'add-ret': { const v = num($('#rt-valor').value); if (v <= 0) { toast('Informe o valor.'); break; }
      await save('retiradas', {id: uid(), socioId: $('#rt-socio').value, tipo: $('#rt-tipo').value, valor: v, data: $('#rt-data').value || today(), pagoCom: $('#rt-pago').value}, true); render(); toast('Retirada registrada'); break; }
    case 'del-ret': arm(btn, async () => { await remove('retiradas', d.id); toast('Retirada excluída'); }); break;
    case 'add-socio': sociosEdit.list.push({id: uid(), nome: '', pct: 0}); $('#soc-list').innerHTML = sociosTable(); break;
    case 'del-socio': sociosEdit.list.splice(+d.i, 1); $('#soc-list').innerHTML = sociosTable(); break;
    case 'save-socios': { const list = sociosEdit.list.filter(s => String(s.nome).trim()).map(s => ({...s, nome: s.nome.trim(), pct: num(s.pct)}));
      await saveConfig({...S.config, socios: list, reservaPct: num(sociosEdit.reserva)}); sociosEdit = null; render(); toast('Sócios salvos'); break; }

    /* ajustes */
    case 'save-config': {
      await saveConfig({...S.config, loja:$('#cf-loja').value.trim() || CFG_DEF.loja, whatsapp:$('#cf-wa').value.trim(), instagram:$('#cf-insta').value.trim(), endereco:$('#cf-end').value.trim(),
        pix:$('#cf-pix').value.trim(), pixNome:$('#cf-pixnome').value.trim(), sinalPct:num($('#cf-sinal').value), meta:num($('#cf-meta').value), prazo:num($('#cf-prazo').value), rodape:$('#cf-rodape').value.trim(),
        formas: (fmEdit || todasFormas()).filter(f => String(f.nome || '').trim()).map(f => ({...f, nome: f.nome.trim(), parcMax: Math.max(1, Math.round(num(f.parcMax))) }))});
      fmEdit = null; render(); toast('Ajustes salvos'); break; }
    case 'del-logo': arm(btn, async () => { const old = cfg().logoId; const {logoId, logoData, ...rest} = S.config; await saveConfig(rest); try { if (assets && old) await assets.delete(old); } catch (e) {} render(); toast('Logo removida'); }); break;
    case 'add-forma': fmEdit.push({id: uid(), nome: 'Nova forma', taxa: 0, fixa: 0, parcMax: 1, taxaParc: 0}); $('#fm-list').innerHTML = fmTable(); break;
    case 'del-forma': fmEdit.splice(+d.i, 1); $('#fm-list').innerHTML = fmTable(); break;
    case 'reset-formas': fmEdit = JSON.parse(JSON.stringify(FORMAS_DEF)); $('#fm-list').innerHTML = fmTable(); toast('Padrão restaurado. Clique em Salvar para manter.'); break;

    /* exportações */
    case 'exp-pedidos': expPedidos(); break;
    case 'exp-clientes': expClientes(); break;
    case 'exp-despesas': expDespesas(); break;
    case 'exp-leads': expLeads(); break;
    case 'exp-dre': expDre(); break;
    case 'exp-backup': expBackup(); break;
  }
}

/* ================= inicialização ================= */
render();
(async () => {
  try { db = window.claude?.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (db) {
    const ready = () => [...COLS, 'config'].every(k => loaded[k]);
    const done = () => { if (mode === 'loading') { mode = 'db'; render(); } else render(true); };
    for (const col of COLS) {
      db.collection(col).onSnapshot(snap => {
        S[col] = snap.docs.map(d => ({id: d.id, ...d.data()}));
        loaded[col] = true; if (ready()) done();
      }, err => { loaded[col] = true; if (err.code === 'revoked') toast('Seu acesso a esta página mudou. Recarregue.'); });
    }
    db.doc('config/loja').onSnapshot(snap => { S.config = snap.exists ? {...snap.data()} : {}; loaded.config = true; if (ready()) done(); }, () => { loaded.config = true; });
    setTimeout(() => { if (mode === 'loading') { mode = 'db'; render(); } }, 6000);
    try { assets = await window.claude.use('assets'); } catch (e) { assets = null; }
  } else {
    mode = 'local';
    try { const s = JSON.parse(localStorage.getItem(LS) || 'null'); if (s) COLS.concat('config').forEach(k => { if (s[k]) S[k] = s[k]; }); } catch (e) {}
    render();
  }
})();
</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');</script>
</body>
