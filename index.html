<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2A63">
<meta name="description" content="Sistema de vendas da RF Creative Personalizados">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RF Creative">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>RF Creative Personalizados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Cinzel:wght@600&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
/* Layout: barra lateral agrupada por área (desktop) / barra inferior + menu "Mais" (celular); cores de status seguem o CMYK da gráfica (C = aprovado, M = produção, Y = arte). */
:root{
  --bg:#EFF2F8; --surface:#FFFFFF; --surface-2:#F6F7FA; --ink:#14161D; --muted:#5D6371; --line:#E0E2EA;
  --accent:#1D5FD1; --accent-soft:#E2EBFB; --accent-ink:#FFFFFF; --mag:#C8136A; --mag-soft:#FBE3EF;
  --cyan:#0C86AE; --cyan-soft:#DDF1F8; --yellow:#A87900; --yellow-soft:#FCF1CF;
  --ok:#1E8556; --ok-soft:#DDF3E8; --warn:#B86A00; --warn-soft:#FDEBD3; --bad:#BF3434; --bad-soft:#FBE1E1;
  --shadow:0 1px 2px rgba(20,22,29,.06),0 8px 24px -12px rgba(20,22,29,.18);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1018; --surface:#171A21; --surface-2:#1D2029; --ink:#ECEEF3; --muted:#9BA1AE; --line:#2A2E39;
  --accent:#5B95F7; --accent-soft:#16264A; --accent-ink:#06122B; --mag:#F0489B; --mag-soft:#3A1729;
  --cyan:#45B9DE; --cyan-soft:#10303C; --yellow:#F0C43C; --yellow-soft:#3A3010;
  --ok:#47C38B; --ok-soft:#11301F; --warn:#F2A443; --warn-soft:#3A2810; --bad:#EF6E6E; --bad-soft:#3A1616;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C1018; --surface:#171A21; --surface-2:#1D2029; --ink:#ECEEF3; --muted:#9BA1AE; --line:#2A2E39;
  --accent:#5B95F7; --accent-soft:#16264A; --accent-ink:#06122B; --mag:#F0489B; --mag-soft:#3A1729;
  --cyan:#45B9DE; --cyan-soft:#10303C; --yellow:#F0C43C; --yellow-soft:#3A3010;
  --ok:#47C38B; --ok-soft:#11301F; --warn:#F2A443; --warn-soft:#3A2810; --bad:#EF6E6E; --bad-soft:#3A1616;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:1.85rem;font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:.98rem;font-weight:700}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.pos{color:var(--ok)} .neg{color:var(--bad)} .wrn{color:var(--warn)}

/* app shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:16px;padding:20px 12px;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand svg{flex:none}
.brand-logo{display:flex;flex:none}
.brand img,.logo-img{width:42px;height:42px;object-fit:contain;border-radius:8px;flex:none}
.logo-box{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo-prev{width:120px;height:120px;border:1px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);overflow:hidden}
.logo-prev img{width:100px;height:100px;max-width:100%;max-height:100%;object-fit:contain}
.m-logo{display:none}
.brand b{display:block;font-family:"Cinzel",Georgia,serif;font-weight:600;font-size:1rem;line-height:1.1;letter-spacing:.06em;color:var(--ink)}
.brand small{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:.98rem;letter-spacing:.04em;color:var(--accent);margin-top:1px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .grp{font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;padding:12px 12px 4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 12px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:600;text-align:left;font-size:.9rem}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.nav .cta{margin-block:4px;background:var(--accent);color:var(--accent-ink);justify-content:center;padding:9px 12px}
.nav .cta:hover,.nav .cta[aria-current="page"]{background:var(--accent);color:var(--accent-ink);filter:brightness(1.07)}
.nav .more-btn{display:none}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:.66rem;padding:1px 7px;font-weight:700}
.side-foot{margin-top:auto;padding:12px;border-radius:8px;background:var(--surface-2);font-size:.78rem;color:var(--muted)}
.side-foot b{color:var(--ink)}
.more-menu{display:none}
.main{min-width:0;padding-inline:28px;padding-block:26px 60px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted)}

.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);background:var(--yellow-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--yellow) 30%,transparent)}
.banner p{margin:0;flex:1 1 260px}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.banner.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent);background:transparent}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.btn.sm{padding:6px 10px;font-size:.82rem}
.btn.xs{padding:3px 8px;font-size:.78rem;border-radius:6px}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:0}
.in{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:.92rem;min-width:0}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{resize:vertical;min-height:40px;line-height:1.45}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.hint{font-size:.78rem;color:var(--muted);font-weight:400}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.kpi .s{font-size:.8rem;color:var(--muted)}
.kpi.hl{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kpi.hl .eyebrow,.kpi.hl .s{color:color-mix(in srgb,var(--accent-ink) 78%,transparent)}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.cols.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols.three{grid-template-columns:repeat(3,minmax(0,1fr))}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:.74rem;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.st-orcamento,.ld-novo{background:var(--surface-2);color:var(--muted)}
.st-aprovado,.ld-conversa{background:var(--cyan-soft);color:var(--cyan)}
.st-arte,.ld-orcamento{background:var(--yellow-soft);color:var(--yellow)}
.st-producao,.ld-negociacao{background:var(--mag-soft);color:var(--mag)}
.st-pronto,.ld-ganho{background:var(--ok-soft);color:var(--ok)}
.st-entregue{background:var(--surface-2);color:var(--ink)}
.st-cancelado,.ld-perdido{background:var(--bad-soft);color:var(--bad)}
.c-ok{background:var(--ok-soft);color:var(--ok)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-bad{background:var(--bad-soft);color:var(--bad)}
.c-acc{background:var(--accent-soft);color:var(--accent)}

/* alerts */
.alerts{display:flex;gap:10px;flex-wrap:wrap}
.alert{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:.88rem;font-weight:600;text-align:left}
.alert:hover{border-color:var(--muted)}
.alert .n{font-family:var(--f-display);font-size:1.15rem;font-weight:800;min-width:22px;text-align:center}
.alert.bad .n{color:var(--bad)} .alert.warn .n{color:var(--warn)} .alert.acc .n{color:var(--accent)}

/* lists */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .grow span{font-size:.82rem;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .grow span.wrap{white-space:normal}
.row.click{cursor:pointer;border-radius:8px}
.row.click:hover{background:var(--surface-2)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.big{height:12px}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:.9rem}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .grid{stroke:var(--line)}
.chart .b{fill:var(--accent);opacity:.32}
.chart .b.hl{opacity:1}
.chart .b:hover{opacity:.8}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
td .sub{display:block;font-size:.78rem;color:var(--muted)}
td.wrap{white-space:normal;min-width:180px}
tr.tot td{font-weight:700;background:var(--surface-2)}
tr.fin td{font-weight:800;background:var(--accent-soft);color:var(--ink)}
tr.subl td:first-child{padding-left:28px;color:var(--muted)}

/* toolbar & tabs */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .in{max-width:300px}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.82rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:10px 14px;border:0;background:transparent;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 6px;gap:6px}
.col-h .sum{font-size:.75rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:var(--shadow);text-align:left;width:100%}
.card:hover{border-color:var(--muted)}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card .who{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .what{font-size:.82rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .bot{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.card .adv{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:3px 8px;font-size:.75rem;font-weight:700;color:var(--muted)}
.card .adv:hover{color:var(--accent);border-color:var(--accent)}
.card .clip{font-size:.74rem;color:var(--muted)}

/* PDV */
.pdv{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,420px);gap:18px;align-items:start}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.prod{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-height:118px}
.prod:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.prod.svc{border-style:dashed}
.prod .cat{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.prod b{font-size:.92rem;line-height:1.25}
.prod .p{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.prod .p .num{font-weight:600;color:var(--accent)}
.prod .p small{color:var(--muted);font-size:.74rem}
.prod .p small.low{color:var(--bad);font-weight:700}
.cart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:14px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.item-top{display:flex;gap:8px;align-items:center}
.item-top b{flex:1;min-width:0;font-size:.9rem}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.qty button{border:0;background:transparent;width:28px;height:28px;font-weight:700;color:var(--muted)}
.qty button:hover{color:var(--accent)}
.qty span{min-width:26px;text-align:center}
.item .in{padding:7px 9px;font-size:.85rem}
.totals{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px dashed var(--line)}
.totals div{display:flex;justify-content:space-between;gap:10px}
.totals .big{font-family:var(--f-display);font-weight:800;font-size:1.5rem}
.radio-row{display:flex;gap:8px;flex-wrap:wrap}
.radio-row label{flex:1;display:flex;gap:8px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:.86rem;font-weight:600;cursor:pointer;background:var(--surface)}
.radio-row label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.radio-row input{accent-color:var(--accent)}

/* agenda */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:center;padding-bottom:2px}
.day{min-height:96px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;overflow:hidden}
.day:hover{border-color:var(--muted)}
.day.out{opacity:.4}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day.sel{background:var(--accent-soft)}
.day .dn{font-family:var(--f-mono);font-size:.78rem;font-weight:600}
.day .ev{font-size:.7rem;padding:2px 5px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.day .fest{font-size:.66rem;color:var(--mag);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .more{font-size:.68rem;color:var(--muted)}

/* modal */
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-start;justify-content:center;padding:max(5vh,16px) 16px 16px;z-index:50;overflow-y:auto}
.modal{width:100%;max-width:680px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.modal-f{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 14px 14px}
.modal-f .r{display:flex;gap:8px;flex-wrap:wrap}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:.78rem;font-weight:700;color:var(--muted)}
.steps button.on{border-color:transparent}
.pg-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 90px auto;gap:10px;align-items:end}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.9rem;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:96px;height:96px;border-radius:8px;border:1px solid var(--line);overflow:hidden;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted);text-align:center;text-decoration:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:color-mix(in srgb,var(--ink) 70%,transparent);color:var(--bg);font-weight:700;line-height:1;font-size:.8rem;padding:0}
.thumb .x.armed{width:auto;padding:0 8px;border-radius:99px;background:var(--bad);color:#fff}
.upload{width:96px;height:96px;border:1.5px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.74rem;color:var(--muted);cursor:pointer;text-align:center;padding:6px}
.upload:hover{border-color:var(--accent);color:var(--accent)}
.upload svg{width:20px;height:20px}
.upload input{display:none}
.timeline{display:flex;flex-direction:column;gap:6px;font-size:.84rem}
.timeline div{display:flex;gap:10px;align-items:center}
.timeline .mono{color:var(--muted);font-size:.78rem;min-width:92px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:.9rem;opacity:0;transition:.2s;pointer-events:none;z-index:60;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* statement */
.dre{display:flex;flex-direction:column;font-size:.92rem}
.dre div{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-top:1px solid var(--line)}
.dre div:first-child{border-top:0}
.dre .tot{font-weight:700;border-top:2px solid var(--ink)}

/* sócios / empréstimos */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box.click{cursor:pointer}
.box.click:hover{border-color:var(--muted)}
.box .big{font-family:var(--f-display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
.box .kv{font-size:.86rem}

.welcome{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:center;padding:28px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.welcome h2{font-size:1.6rem}
.welcome ol{margin:10px 0 0;padding-left:20px;color:var(--muted);display:flex;flex-direction:column;gap:6px}

@media (max-width:1080px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cols,.cols.even,.cols.three{grid-template-columns:1fr}.pdv{grid-template-columns:1fr}.cart{position:static}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:40;gap:0;overflow:visible}
  .brand,.side-foot,.nav .grp{display:none}
  .m-logo{display:block;height:64px;width:auto;max-width:100%;object-fit:contain;margin-bottom:4px;border-radius:10px}
  .nav{flex-direction:row;width:100%;justify-content:space-between}
  .nav button{flex-direction:column;gap:3px;padding:6px 2px;font-size:.66rem;justify-content:center;text-align:center;position:relative}
  .nav .cta{margin-block:0}
  .nav .x{display:none}
  .nav .more-btn{display:flex}
  .nav .badge{position:absolute;top:0;right:18%;margin:0}
  .more-menu.open{display:flex;flex-direction:column;gap:1px;position:fixed;right:10px;left:10px;bottom:calc(70px + env(safe-area-inset-bottom,0px));max-height:70vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:45}
  .more-menu .grp{font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;padding:10px 12px 2px}
  .more-menu button{display:flex;gap:10px;align-items:center;padding:10px 12px;border:0;background:transparent;border-radius:8px;font-weight:600;color:var(--ink);text-align:left}
  .more-menu button:hover{background:var(--surface-2)}
  .more-menu svg{width:18px;height:18px}
  .main{padding-inline:16px;padding-block:18px 100px}
  h1{font-size:1.5rem}
  .welcome{grid-template-columns:1fr;padding:20px}
  .day{min-height:58px;padding:4px}
  .day .ev,.day .fest,.day .more.d{display:none}
}
@media (min-width:861px){.day .more.m{display:none}}
@media (max-width:520px){.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:14px}.kpi .v{font-size:1.2rem}.grid3{grid-template-columns:1fr 1fr}.grid2,.grid4{grid-template-columns:1fr}.cal{gap:3px}.pg-form{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="brand-logo" id="brand-logo"></span>
      <div><b id="brand-name">RF Creative</b><small>Personalizados</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sidefoot">Conectando…</div>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<div class="more-menu" id="more-menu"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="rf-nuvem.js"></script>
<script>
/* ================= base ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => (Number(n) || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const dec = n => (Number(n) || 0).toFixed(2).replace('.', ',');
const pctf = n => (Number(n) || 0).toFixed(1).replace('.', ',') + '%';
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const addMonths = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const addMonthsDate = (s, n) => { const [y, m, d] = s.split('-').map(Number); const last = new Date(y, m - 1 + n + 1, 0).getDate(); const r = new Date(y, m - 1 + n, Math.min(d, last), 12); return ymd(r); };
const dmy = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '—';
const dmyy = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '—';
const dayOf = iso => iso ? ymd(new Date(iso)) : '';
const diffDays = (a, b) => Math.round((new Date(a + 'T12:00:00') - new Date(b + 'T12:00:00')) / 864e5);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sum = (arr, f) => arr.reduce((s, x) => s + (Number(f(x)) || 0), 0);
/* aceita "1.234,56", "1234,56" e "1234.56" */
const num = v => { if (typeof v === 'number') return isFinite(v) ? v : 0; let s = String(v ?? '').trim().replace(/[^\d,.\-]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = parseFloat(s); return isFinite(n) ? n : 0; };
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mesNome = ym => { const [y, m] = ym.split('-').map(Number); return MESES[m - 1] + ' ' + y; };
const CAT_DESP = ['Material / insumos','Embalagem','Frete / entregas','Energia / internet','Aluguel','Impostos / MEI','Marketing / anúncios','Equipamentos','Manutenção','Outros'];
const PAGO_COM = ['Conta / Pix da empresa','Dinheiro do caixa','Cartão da empresa'];

/* formas de pagamento: taxa % + taxa fixa R$; parcelado soma taxaParc % por parcela além da 1ª */
const FORMAS_DEF = [
  {id:'pix', nome:'Pix', taxa:0, fixa:0, parcMax:1, taxaParc:0},
  {id:'dinheiro', nome:'Dinheiro', taxa:0, fixa:0, parcMax:1, taxaParc:0},
  {id:'debito', nome:'Cartão de débito', taxa:1.99, fixa:0, parcMax:1, taxaParc:0},
  {id:'credito', nome:'Cartão de crédito', taxa:4.99, fixa:0, parcMax:12, taxaParc:1.5},
  {id:'link', nome:'Link de pagamento', taxa:4.99, fixa:0, parcMax:12, taxaParc:1.5},
  {id:'boleto', nome:'Boleto', taxa:0, fixa:3.49, parcMax:1, taxaParc:0},
  {id:'transf', nome:'Transferência / TED', taxa:0, fixa:0, parcMax:1, taxaParc:0},
];
const todasFormas = () => (S.config.formas?.length ? S.config.formas : FORMAS_DEF);
const formas = () => todasFormas().filter(f => f.ativa !== false);
const formaPor = nome => todasFormas().find(f => f.nome === nome);
const pctTaxa = (f, parc = 1) => f ? num(f.taxa) + (parc > 1 ? num(f.taxaParc) * (parc - 1) : 0) : 0;
const taxaDe = (nome, valor, parc = 1) => { const f = formaPor(nome); if (!f || !valor) return 0; return Math.round((valor * pctTaxa(f, parc) / 100 + num(f.fixa)) * 100) / 100; };
const taxaPag = x => num(x.taxa);
const formaLabel = x => x.forma + (num(x.parcelas) > 1 ? ` ${x.parcelas}x` : '');
const formasTexto = () => formas().map(f => num(f.parcMax) > 1 ? `${f.nome} (até ${f.parcMax}x)` : f.nome).join(', ');
const parcOpts = (f, sel = 1) => Array.from({length: Math.max(1, num(f?.parcMax))}, (_, i) => `<option value="${i + 1}" ${i + 1 === +sel ? 'selected' : ''}>${i + 1}x</option>`).join('');

const STATUS = [
  {k:'orcamento', l:'Orçamento'}, {k:'aprovado', l:'Aprovado'}, {k:'arte', l:'Arte'},
  {k:'producao', l:'Produção'}, {k:'pronto', l:'Pronto p/ entrega'}, {k:'entregue', l:'Entregue'},
];
const ST = Object.fromEntries([...STATUS, {k:'cancelado', l:'Cancelado'}].map(s => [s.k, s.l]));
const chip = k => `<span class="chip st-${k}"><i></i>${ST[k] || k}</span>`;

const ETAPAS = [
  {k:'novo', l:'Novo contato'}, {k:'conversa', l:'Em conversa'}, {k:'orcamento', l:'Orçamento enviado'},
  {k:'negociacao', l:'Negociação'}, {k:'ganho', l:'Fechou'}, {k:'perdido', l:'Perdido'},
];
const ET = Object.fromEntries(ETAPAS.map(s => [s.k, s.l]));
const chipLd = k => `<span class="chip ld-${k}"><i></i>${ET[k] || k}</span>`;
const ORIGENS = ['Instagram','WhatsApp','Indicação','Facebook','Google','Feira / evento','Loja física','Cliente antigo','Outro'];
const MOTIVOS = ['Preço','Prazo de entrega','Parou de responder','Comprou em outro lugar','Desistiu','Outro'];
const CANAIS = ['WhatsApp','Instagram','Telefone','Presencial','E-mail'];
const ASSUNTOS = ['Orçamento','Dúvida','Acompanhamento de pedido','Pós-venda','Reclamação','Retorno / follow-up','Promoção','Outro'];
const SEGMENTOS = ['Pessoa física','Empresa','Escola','Igreja / ONG','Revendedor','Evento / festa'];
const TIPOS_RET = {distribuicao:'Distribuição de lucro', prolabore:'Pró-labore', adiantamento:'Adiantamento'};

const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  painel: svg('<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>'),
  pedidos: svg('<path d="M4 5h4v14H4zM10 5h4v9h-4zM16 5h4v6h-4z"/>'),
  novo: svg('<path d="M12 5v14M5 12h14"/>'),
  agenda: svg('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  crm: svg('<path d="M3 4h18l-7 8v6l-4 2v-8z"/>'),
  atendimentos: svg('<path d="M4 14v-3a8 8 0 0 1 16 0v3"/><rect x="2" y="13" width="5" height="7" rx="2"/><rect x="17" y="13" width="5" height="7" rx="2"/>'),
  mensagens: svg('<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>'),
  clientes: svg('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>'),
  produtos: svg('<path d="M5 7h11v9a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z"/><path d="M16 9h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3v2M12 3v2"/>'),
  servicos: svg('<path d="M14 4l6 6-9 9H5v-6z"/><path d="M12 6l6 6"/>'),
  financeiro: svg('<rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 10v5M18 10v5"/>'),
  fechamento: svg('<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>'),
  emprestimos: svg('<path d="M3 21h18M4 10h16M12 3l9 5H3z"/><path d="M6 10v8M10 10v8M14 10v8M18 10v8"/>'),
  divisao: svg('<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>'),
  dre: svg('<path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 19h4"/>'),
  relatorio: svg('<path d="M3 20h18M6 16v-5M11 16V7M16 16v-8M21 16V4"/>'),
  ajustes: svg('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'),
  mais: svg('<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'),
  copy: svg('<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>'),
  down: svg('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'),
  up: svg('<path d="M12 20V9M7 14l5-5 5 5M5 4h14"/>'),
  img: svg('<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/>'),
  edit: svg('<path d="M4 20h4L19 9l-4-4L4 16z"/>'),
};
const VIEWS = [
  {k:'painel', l:'Painel'},
  {g:'Vendas'}, {k:'pedidos', l:'Pedidos'}, {k:'novo', l:'Novo pedido', cta:true}, {k:'agenda', l:'Agenda', x:true},
  {g:'Relacionamento'}, {k:'crm', l:'CRM'}, {k:'atendimentos', l:'Atendimentos', x:true}, {k:'mensagens', l:'Mensagens', x:true}, {k:'clientes', l:'Clientes', x:true},
  {g:'Catálogo'}, {k:'produtos', l:'Produtos', x:true}, {k:'servicos', l:'Serviços', x:true},
  {g:'Financeiro'}, {k:'financeiro', l:'Caixa e despesas', x:true}, {k:'fechamento', l:'Fechamento', x:true}, {k:'emprestimos', l:'Empréstimos', x:true},
  {k:'divisao', l:'Divisão de lucros', x:true}, {k:'dre', l:'DRE', x:true}, {k:'relatorio', l:'Relatórios', x:true},
  {g:'Sistema'}, {k:'ajustes', l:'Ajustes', x:true},
];

/* ================= dados ================= */
const COLS = ['produtos','clientes','pedidos','despesas','insumos','leads','atendimentos','modelos','fechamentos','emprestimos','retiradas'];
const S = {config:{}}; COLS.forEach(c => S[c] = []);
const CFG_DEF = {loja:'RF Creative Personalizados', whatsapp:'', pix:'', pixNome:'', instagram:'', endereco:'', sinalPct:50, meta:0, prazo:3, reservaPct:20, socios:[],
  rodape:'Trabalhamos com 50% de sinal para iniciar a arte e o restante na entrega.'};
const cfg = () => ({...CFG_DEF, ...S.config});
const socios = () => cfg().socios || [];
let db = null, assets = null, mode = 'loading', view = 'painel';
const loaded = {};
const LS = 'rf-creative-local-v1';

function persistLocal(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
async function save(col, obj, quiet){
  const i = S[col].findIndex(x => x.id === obj.id);
  if (i >= 0) S[col][i] = obj; else S[col].push(obj);
  if (!quiet) render(true);
  if (db) {
    const {id, ...body} = obj;
    try { await db.collection(col).doc(id).set(JSON.parse(JSON.stringify(body))); }
    catch (e) { toast(e.code === 'permission-denied' ? 'Seu usuário não tem permissão para salvar. Peça para incluir seu e-mail na lista de acesso.' : e.code === 'quota_exceeded' ? 'Limite de armazenamento atingido. Apague registros antigos.' : e.code === 'invalid_argument' ? 'Você não tem permissão para salvar nesta página.' : 'Não foi possível salvar. Verifique a conexão e tente de novo.'); }
  } else persistLocal();
}
async function remove(col, id, quiet){
  S[col] = S[col].filter(x => x.id !== id);
  if (!quiet) render(true);
  if (db) { try { await db.collection(col).doc(id).delete(); } catch (e) { toast('Não foi possível excluir.'); } }
  else persistLocal();
}
async function saveConfig(obj){
  S.config = obj;
  if (db) { try { await db.doc('config/loja').set(JSON.parse(JSON.stringify(obj))); } catch (e) { toast('Não foi possível salvar os ajustes.'); } }
  else persistLocal();
}

const calc = p => {
  const sub = sum(p.itens || [], it => it.qtd * it.preco);
  const custo = sum(p.itens || [], it => it.qtd * (it.custo || 0));
  const total = Math.max(0, sub - num(p.desconto) + num(p.frete));
  const pago = sum(p.pagamentos || [], x => num(x.valor));
  return {sub, custo, total, pago, saldo: Math.max(0, total - pago)};
};
const isVenda = p => p.status !== 'orcamento' && p.status !== 'cancelado';
const nextNumero = () => S.pedidos.reduce((m, p) => Math.max(m, p.numero || 0), 1000) + 1;
const cliente = id => S.clientes.find(c => c.id === id);
const produto = id => S.produtos.find(c => c.id === id);
const isServ = p => p?.tipo === 'servico';
const nomeCliente = p => cliente(p.clienteId)?.nome || p.clienteNome || 'Cliente avulso';
const primeiroNome = nome => String(nome || '').replace(/\s*\(exemplo\)/, '').split(' ')[0];

/* pedido: grava o histórico de etapas e acerta o estoque (serviços não têm estoque) */
async function savePedido(p){
  const old = S.pedidos.find(x => x.id === p.id);
  if (!old || old.status !== p.status) p = {...p, historico: [...(p.historico || []), {st: p.status, em: new Date().toISOString()}]};
  const counts = x => x && x.status !== 'orcamento' && x.status !== 'cancelado';
  const delta = {};
  if (counts(old)) old.itens.forEach(i => delta[i.produtoId] = (delta[i.produtoId] || 0) + i.qtd);
  if (counts(p)) p.itens.forEach(i => delta[i.produtoId] = (delta[i.produtoId] || 0) - i.qtd);
  for (const [pid, dq] of Object.entries(delta)) if (dq) { const pr = produto(pid); if (pr && !isServ(pr)) await save('produtos', {...pr, estoque: num(pr.estoque) + dq}, true); }
  await save('pedidos', p);
  return p;
}

/* ================= finanças: um só cálculo para Caixa, DRE, Divisão e Fechamento ================= */
const pagsTodos = () => S.pedidos.filter(p => p.status !== 'cancelado').flatMap(p => (p.pagamentos || []).map(x => ({...x, p})));
const calcEmp = e => {
  const n = Math.max(1, num(e.n)), vp = num(e.valorParcela), pagasN = (e.pagas || []).length;
  const total = n * vp, juros = Math.max(0, total - num(e.valor)), jurosParc = Math.max(0, vp - num(e.valor) / n);

function finPeriodo(pref){
  const inP = d => (d || '').startsWith(pref);
  const vendas = S.pedidos.filter(p => isVenda(p) && inP(dayOf(p.criadoEm)));
  let bruta = 0, desc = 0, cmv = 0;
  vendas.forEach(p => { const c = calc(p); bruta += c.sub + num(p.frete); desc += Math.min(num(p.desconto), c.sub + num(p.frete)); cmv += c.custo; });
  const pags = pagsTodos().filter(x => inP(x.data));

  const desp = S.despesas.filter(d => inP(d.data));
  const despCat = {}; desp.forEach(d => despCat[d.categoria] = (despCat[d.categoria] || 0) + num(d.valor));
  const totDesp = sum(desp, d => num(d.valor));
  const prolabore = sum(S.retiradas.filter(r => r.tipo === 'prolabore' && inP(r.data)), r => num(r.valor));
  let jurosPagos = 0, jurosRecebidos = 0, amortizacao = 0;

  const liqRec = bruta - desc, lucroBruto = liqRec - cmv;
  const operacional = lucroBruto - totDesp - prolabore - taxas;
  const lucro = operacional - jurosPagos + jurosRecebidos;
  return {vendas, bruta, desc, liqRec, cmv, lucroBruto, despCat, desp, totDesp, prolabore, taxas, operacional, jurosPagos, jurosRecebidos, amortizacao, lucro, pags, recebido};
}
function divisaoPeriodo(pref){
  const f = finPeriodo(pref), c = cfg();

function renderNav(){

  const badge = k => bd[k] ? `<span class="badge">${bd[k]}</span>` : '';

    + `<button class="more-btn" data-act="more" ${VIEWS.find(v => v.k === view)?.x ? 'aria-current="page"' : ''}>${I.mais}<span>Mais</span>${Object.entries(bd).some(([k, n]) => n && VIEWS.find(v => v.k === k)?.x) ? '<span class="badge">!</span>' : ''}</button>`;
  $('#more-menu').className = 'more-menu' + (moreOpen ? ' open' : '');
  let g = '';
  $('#more-menu').innerHTML = VIEWS.map(v => { if (v.g !== undefined) { g = v.g; return ''; } if (!v.x) return ''; const h = g ? `<div class="grp">${g}</div>` : ''; g = ''; return h + `<button data-go="${v.k}">${I[v.k]}${v.l}${badge(v.k)}</button>`; }).join('');

}
function go(v){ view = v; moreOpen = false; fmEdit = null; sociosEdit = null; render(); window.scrollTo(0, 0); }

/* ================= render ================= */
const VIEW_FN = () => ({painel, pedidos, novo, agenda, crm, atendimentos, mensagens, clientes, produtos, servicos, financeiro, fechamento, emprestimos, divisao, dre, relatorio, ajustes});
function render(fromData){
  renderNav();
  const el = $('#view');
  if (mode === 'loading') { el.innerHTML = `<div class="empty">Carregando seus dados…</div>`; return; }
  if (fromData) {
    if (view === 'novo' && $('#pdv')) { renderProdGrid(); renderClienteSelect(); return; }
    if (view === 'pedidos' && $('#board-area')) { renderBoard(); return; }
    if (view === 'mensagens' && $('#msg-list')) { renderMsgList(); return; }
    const a = document.activeElement;
    if (a && el.contains(a) && a.matches('input,textarea,select')) return;
  }
  el.innerHTML = VIEW_FN()[view]();
  if (view === 'pedidos') renderBoard();
  if (view === 'novo') { renderProdGrid(); renderClienteSelect(); renderCart(); }
  if (view === 'ajustes') renderSim();
  if (view === 'mensagens') renderMsgList();
  if (view === 'fechamento') updCaixa();
}

  if (!COLS.some(c => S[c].some(p => p.exemplo))) return '';

}

function painel(){
  const t = today(), mes = t.slice(0, 7), c = cfg();
  const empty = !S.pedidos.length && !S.produtos.length;
  const dt = new Date();
  const d30 = addDays(t, -29);
  const v30 = S.pedidos.filter(p => isVenda(p) && dayOf(p.criadoEm) >= d30);
  const vendido30 = sum(v30, p => calc(p).total);
  const vendMes = sum(S.pedidos.filter(p => isVenda(p) && dayOf(p.criadoEm).startsWith(mes)), p => calc(p).total);
  const rec30 = sum(pagsTodos().filter(x => (x.data || '') >= d30), x => num(x.valor));
  const abertos = S.pedidos.filter(p => isVenda(p) && p.status !== 'entregue');
  const aReceber = sum(S.pedidos.filter(isVenda), p => calc(p).saldo);
  const emProd = S.pedidos.filter(p => ['aprovado','arte','producao'].includes(p.status)).length;
  const orcs = S.pedidos.filter(p => p.status === 'orcamento');
  const ticket = v30.length ? vendido30 / v30.length : 0;
  const a = alertas();

  const days = Array.from({length:14}, (_, i) => addDays(t, i - 13));
  const vals = days.map(d => sum(S.pedidos.filter(p => isVenda(p) && dayOf(p.criadoEm) === d), p => calc(p).total));
  const prox = abertos.filter(p => p.entrega).sort((x, y) => x.entrega.localeCompare(y.entrega)).slice(0, 6);
  const top = {};
  v30.forEach(p => p.itens.forEach(it => { top[it.nome] = (top[it.nome] || 0) + it.qtd; }));
  const topL = Object.entries(top).sort((x, y) => y[1] - x[1]).slice(0, 5), topMax = topL[0]?.[1] || 1;

  const lastDay = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate(), restam = lastDay - dt.getDate() + 1;
  const meta = num(c.meta), pct = meta ? Math.min(100, vendMes / meta * 100) : 0;
  const aniv = S.clientes.filter(cl => /^\d\d-\d\d$/.test(cl.aniversario || '')).map(cl => { let d = t.slice(0, 4) + '-' + cl.aniversario; if (d < t) d = (+t.slice(0, 4) + 1) + '-' + cl.aniversario; return {cl, d, em: diffDays(d, t)}; }).filter(x => x.em <= 15).sort((x, y) => x.em - y.em);
  const pl = (n, s, p) => n + ' ' + (n > 1 ? p : s);

  </div>

    <section class="panel"><div class="panel-h"><h2>Mais vendidos · 30 dias</h2><span class="muted small">unidades</span></div>
      <div class="rows">${topL.length ? topL.map(([n, q]) => barRow(esc(n), `<b class="num">${q}</b>`, q / topMax)).join('') : `<div class="empty">Os produtos mais vendidos aparecem aqui.</div>`}</div></section>
  </div>

      <button class="btn sm" data-act="campanha-data" style="margin-top:10px">${I.mensagens} Avisar clientes pelo WhatsApp</button></section>
    <section class="panel"><div class="panel-h"><h2>Aniversariantes</h2><span class="muted small">próximos 15 dias</span></div>
      <div class="rows">${aniv.length ? aniv.map(x => `<div class="row click" data-cli="${x.cl.id}"><div class="grow"><b>${esc(x.cl.nome)}</b><span>${x.em === 0 ? 'Hoje!' : 'em ' + x.em + ' dia' + (x.em > 1 ? 's' : '')} · ${dmy(x.d)}</span></div>${x.cl.whatsapp ? `<a class="btn sm" href="${esc(waLink(x.cl.whatsapp, preencher(modeloPor('b6').texto, {nome: x.cl.nome})))}" target="_blank" rel="noopener" data-reg="${x.cl.id}" data-assunto="Promoção" data-desc="Mensagem de aniversário">Parabenizar</a>` : ''}</div>`).join('') : `<div class="empty">Ninguém faz aniversário nos próximos dias. Cadastre a data no cliente para lembrar aqui.</div>`}</div></section>
  </div>`;
}
function prazoChip(entrega, st){
  if (!entrega) return '';
  if (st === 'entregue') return `<span class="chip">${dmy(entrega)}</span>`;
  const d = diffDays(entrega, today());
  return d < 0 ? `<span class="chip c-bad">Atrasado ${-d}d</span>` : d === 0 ? `<span class="chip c-warn">Hoje</span>` : d === 1 ? `<span class="chip c-warn">Amanhã</span>` : `<span class="chip">${dmy(entrega)}</span>`;
}
const retChip = d => { if (!d) return ''; const x = diffDays(d, today()); return x < 0 ? `<span class="chip c-bad">Atrasado ${-x}d</span>` : x === 0 ? `<span class="chip c-warn">Hoje</span>` : `<span class="chip">${dmy(d)}</span>`; };
function chart(labels, vals, every = 1, colorNeg){
  const W = 640, H = 220, L = 54, R = 8, T = 10, B = 26;
  const raw = Math.max(...vals.map(Math.abs), 1), step = Math.pow(10, Math.floor(Math.log10(raw))), max = Math.ceil(raw / step) * step;
  const bw = (W - L - R) / labels.length, y = v => T + (H - T - B) * (1 - Math.max(0, v) / max);
  const fmt = v => v >= 1000 ? (v / 1000).toLocaleString('pt-BR', {maximumFractionDigits:1}) + 'k' : Math.round(v);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico">
    ${[0, max / 2, max].map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 3}" text-anchor="end">${fmt(v)}</text>`).join('')}
    ${vals.map((v, i) => { const h = Math.max(v ? 3 : 0, (H - T - B) - (y(Math.abs(v)) - T)); return `<rect class="b ${i === labels.length - 1 ? 'hl' : ''}" ${v < 0 && colorNeg ? 'style="fill:var(--bad)"' : ''} x="${L + i * bw + bw * .18}" y="${H - B - h}" width="${bw * .64}" height="${h}" rx="3"><title>${labels[i]}: ${brl(v)}</title></rect>`; }).join('')}
    ${labels.map((d, i) => (labels.length - 1 - i) % every === 0 ? `<text x="${L + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle">${d}</text>` : '').join('')}
  </svg></div>`;
}

/* ================= PEDIDOS ================= */
let qPedidos = '', pedView = 'quadro', pedFiltro = 'abertos';
function pedidos(){
  const filtros = [['abertos','Em aberto'],['todos','Todos'],['atrasados','Atrasados'],['saldo','Com saldo a receber'], ...STATUS.map(s => [s.k, s.l]), ['cancelado','Cancelados']];
  return `${head('Do orçamento à entrega', 'Pedidos', '', `<button class="btn primary" data-go="novo">${I.novo} Novo pedido</button>`)}
  ${sampleBanner()}
  <div class="toolbar"><input class="in" id="q-pedidos" placeholder="Buscar cliente, nº, produto ou personalização" value="${esc(qPedidos)}">
    <div class="seg"><button data-pv="quadro" aria-pressed="${pedView === 'quadro'}">Quadro</button><button data-pv="lista" aria-pressed="${pedView === 'lista'}">Lista</button></div>
    ${pedView === 'lista' ? `<select class="in" id="ped-filtro" style="max-width:210px">${filtros.map(([k, l]) => `<option value="${k}" ${pedFiltro === k ? 'selected' : ''}>${l}</option>`).join('')}</select>` : ''}
  </div>
  <div id="board-area"></div>`;
}
function pedMatch(p){
  const q = qPedidos.trim().toLowerCase();
  return !q || (nomeCliente(p) + ' ' + p.numero + ' ' + p.itens.map(i => i.nome + ' ' + (i.personalizacao || '')).join(' ') + ' ' + (p.obs || '')).toLowerCase().includes(q);
}
function renderBoard(){
  const t = today(), list = S.pedidos.filter(pedMatch), area = $('#board-area');
  if (pedView === 'lista') {
    const f = pedFiltro;
    const keep = p => f === 'todos' ? true : f === 'abertos' ? p.status !== 'entregue' && p.status !== 'cancelado'
      : f === 'saldo' ? isVenda(p) && calc(p).saldo > 0.009 : f === 'atrasados' ? isVenda(p) && p.status !== 'entregue' && p.entrega && p.entrega < t : p.status === f;
    const rows = list.filter(keep).sort((a, b) => b.numero - a.numero);
    area.innerHTML = rows.length ? `<p class="muted small" style="margin:0 0 10px">${rows.length} pedido${rows.length > 1 ? 's' : ''} · ${brl(sum(rows, p => calc(p).total))}</p><div class="tbl-wrap"><table><thead><tr><th>Nº</th><th>Cliente</th><th>Itens</th><th>Criado</th><th>Entrega</th><th>Etapa</th><th class="r">Total</th><th class="r">Saldo</th></tr></thead><tbody>
      ${rows.map(p => { const c = calc(p); return `<tr class="click" data-pedido="${p.id}"><td class="mono">#${p.numero}</td><td><b>${esc(nomeCliente(p))}</b></td><td class="wrap muted small">${esc(p.itens.map(i => i.qtd + '× ' + i.nome).join(', '))}</td><td>${dmy(dayOf(p.criadoEm))}</td><td>${prazoChip(p.entrega, p.status)}</td><td>${chip(p.status)}</td><td class="r num">${brl(c.total)}</td><td class="r num" style="color:${c.saldo > 0.009 && isVenda(p) ? 'var(--warn)' : 'var(--muted)'}">${brl(c.saldo)}</td></tr>`; }).join('')}
      </tbody></table></div>` : `<div class="panel empty">Nenhum pedido neste filtro.</div>`;
    return;
  }
  const canc = list.filter(p => p.status === 'cancelado').length;
  area.innerHTML = `<div class="board">${STATUS.map(s => {
    let items = list.filter(p => p.status === s.k).sort((a, b) => (a.entrega || '').localeCompare(b.entrega || ''));
    if (s.k === 'entregue') items = items.reverse().slice(0, 12);
    return `<div class="col"><div class="col-h">${chip(s.k)}<span class="sum num">${items.length} · ${brl(sum(items, p => calc(p).total))}</span></div>
      ${items.map(p => { const c = calc(p), d = p.entrega ? diffDays(p.entrega, t) : null, late = d !== null && d < 0 && p.status !== 'entregue';
        const nx = STATUS[STATUS.findIndex(x => x.k === p.status) + 1];
        return `<div class="card" data-pedido="${p.id}" tabindex="0">
          <div class="top"><span class="mono" style="font-size:.8rem;color:var(--muted)">#${p.numero}</span>${p.entrega ? `<span class="chip ${late ? 'c-bad' : d !== null && d <= 1 && p.status !== 'entregue' ? 'c-warn' : ''}">${late ? 'Atrasado · ' : ''}${dmy(p.entrega)}</span>` : ''}</div>
          <div class="who">${esc(nomeCliente(p))}</div>
          <div class="what">${esc(p.itens.map(i => i.qtd + '× ' + i.nome).join(' · '))}</div>
          ${p.artes?.length ? `<span class="clip">${p.artes.length} arte${p.artes.length > 1 ? 's' : ''} anexada${p.artes.length > 1 ? 's' : ''}</span>` : ''}
          <div class="bot"><span class="num" style="font-weight:600">${brl(c.total)}</span>${c.saldo > 0.009 ? `<span class="chip c-warn">Falta ${brl(c.saldo)}</span>` : `<span class="chip c-ok">Pago</span>`}</div>
          ${nx ? `<button class="adv" data-act="advance" data-id="${p.id}">Mover para ${nx.l} →</button>` : ''}
        </div>`; }).join('') || `<div class="empty" style="padding:14px 4px">Vazio</div>`}
    </div>`; }).join('')}</div>
    ${canc ? `<p class="muted small" style="margin:10px 0 0">${canc} pedido${canc > 1 ? 's' : ''} cancelado${canc > 1 ? 's' : ''} fora do quadro. <button class="btn xs" data-act="ver-cancelados">Ver cancelados</button></p>` : ''}`;
}

/* ---- mensagens do pedido ---- */
const MSGS = {resumo:'Resumo / orçamento', pix:'Confirmação com Pix', pronto:'Pedido pronto', cobranca:'Lembrete de pagamento', obrigado:'Agradecimento'};
function mensagem(tipo, p){
  const c = calc(p), k = cfg(), nome = primeiroNome(nomeCliente(p));
  const itens = p.itens.map(it => `• ${it.qtd}× ${it.nome} — ${brl(it.qtd * it.preco)}${it.personalizacao ? `\n   _${it.personalizacao}_` : ''}`).join('\n');
  const pixL = k.pix ? `*Pix:* ${k.pix}${k.pixNome ? ` (${k.pixNome})` : ''}` : '';
  const sinal = Math.max(0, c.total * num(k.sinalPct) / 100 - c.pago);
  const L = {
    resumo: [p.status === 'orcamento' ? `*Orçamento #${p.numero} · ${k.loja}*` : `*Pedido #${p.numero} · ${k.loja}*`, `Olá, ${nome}! Segue o resumo:`, '', itens, '',
      num(p.desconto) ? `Desconto: − ${brl(p.desconto)}` : '', num(p.frete) ? `Entrega: ${brl(p.frete)}` : '',
      `*Total: ${brl(c.total)}*`, c.pago ? `Já recebido: ${brl(c.pago)}` : '', c.pago && c.saldo > 0.009 ? `Saldo: ${brl(c.saldo)}` : '',
      p.entrega ? `Previsão de entrega: ${dmyy(p.entrega)}` : '', p.status === 'orcamento' ? `Formas de pagamento: ${formasTexto()}` : '', '', p.status === 'orcamento' ? `Para confirmar, é só responder esta mensagem. ${k.rodape}` : `Etapa atual: ${ST[p.status]}`],
    pix: [`Oi, ${nome}! Seu pedido #${p.numero} está confirmado. 🎨`, '', itens, '', `*Total: ${brl(c.total)}*`,
      sinal > 0.009 ? `Para iniciarmos a arte, o sinal é de *${brl(sinal)}* (${num(k.sinalPct)}%).` : c.saldo > 0.009 ? `Saldo a pagar: *${brl(c.saldo)}*` : 'Pagamento completo, obrigado!',
      pixL, '', 'Assim que fizer o Pix, me manda o comprovante por aqui. Logo te envio a arte para aprovação!'],
    pronto: [`Oba, ${nome}! Seu pedido #${p.numero} está *pronto*! 🎉`, '', p.itens.map(it => `• ${it.qtd}× ${it.nome}`).join('\n'), '',
      c.saldo > 0.009 ? `Saldo a pagar na retirada/entrega: *${brl(c.saldo)}*` : 'Está tudo pago. 😊', c.saldo > 0.009 ? pixL : '', k.endereco ? `Retirada: ${k.endereco}` : '', '', 'Qual o melhor dia e horário para você?'],
    cobranca: [`Oi, ${nome}, tudo bem? Passando para lembrar do saldo do pedido #${p.numero}: *${brl(c.saldo)}*.`, pixL, '', 'Qualquer dúvida estou à disposição. Obrigada!'],
    obrigado: [`${nome}, muito obrigada pela compra! 💙`, 'Esperamos que tenha amado o resultado.', '',
      k.instagram ? `Se puder, posta uma foto e marca a gente no Instagram: ${k.instagram}` : 'Se puder, manda uma foto de como ficou. Adoramos ver!', '', `Até a próxima! ${k.loja}`],
  };
  return L[tipo].filter(x => x !== false && x !== undefined && x !== null).join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

let agMes = today().slice(0, 7), agSel = today();

  const retDay = {}; S.atendimentos.filter(a => a.status === 'aberto' && a.retorno).forEach(a => (retDay[a.retorno] = retDay[a.retorno] || []).push(a));

  const cells = Array.from({length: 42}, (_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return ymd(d); });
  const weeks = cells.slice(35).every(d => d.slice(0, 7) !== agMes) ? cells.slice(0, 35) : cells;

      </button>`; }).join('')}</div>
    </section>
    <section class="panel"><div class="panel-h"><h2 style="text-transform:capitalize">${new Date(agSel + 'T12:00:00').toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'})}</h2></div>

function preencher(texto, ref){
  const k = cfg();
  return String(texto).replace(/\{nome\}/g, primeiroNome(ref.nome)).replace(/\{loja\}/g, k.loja).replace(/\{pix\}/g, k.pix || '(chave Pix)')
    .replace(/\{instagram\}/g, k.instagram || '').replace(/\{whatsapp_loja\}/g, k.whatsapp || '').replace(/\{data\}/g, proxFestas(1)[0]?.[1] || 'A próxima data especial');
}
const PUBLICOS = {todos:'Todos os clientes', ativos:'Compraram nos últimos 90 dias', inativos:'Sem compra há mais de 90 dias', aniv:'Aniversariantes do mês', saldo:'Com saldo a receber', leads:'Contatos do CRM em aberto', empresas:'Empresas, escolas e igrejas'};
function publico(k){
  const t = today(), d90 = addDays(t, -90), mm = t.slice(5, 7);
  const ult = c => S.pedidos.filter(p => p.clienteId === c.id && isVenda(p)).map(p => dayOf(p.criadoEm)).sort().pop();
  const cs = S.clientes.filter(c => c.whatsapp);
  const list = k === 'leads' ? S.leads.filter(l => l.whatsapp && !['ganho','perdido'].includes(l.etapa)).map(l => ({nome: l.nome, whatsapp: l.whatsapp, ref: {clienteId:'', leadId: l.id}}))
    : cs.filter(c => k === 'todos' ? true : k === 'ativos' ? (ult(c) || '') >= d90 : k === 'inativos' ? !ult(c) || ult(c) < d90 : k === 'aniv' ? (c.aniversario || '').startsWith(mm + '-') : k === 'saldo' ? cliStats(c).saldo > 0.009 : ['Empresa','Escola','Igreja / ONG'].includes(c.segmento))
      .map(c => ({nome: c.nome, whatsapp: c.whatsapp, ref: {clienteId: c.id, leadId: ''}}));
  return list.sort((a, b) => a.nome.localeCompare(b.nome));
}
let msgModelo = 'b8', msgPublico = 'todos';
const enviados = new Set();
function mensagens(){
  const m = modeloPor(msgModelo);
  return `${head('Relacionamento', 'Mensagens', 'Escolha um modelo e um grupo de clientes. Cada botão abre o WhatsApp com a mensagem já personalizada.', `<button class="btn primary" data-act="edit-modelo">${I.novo} Novo modelo</button>`)}
  <div class="cols">
    <section class="panel"><div class="panel-h"><h2>Enviar mensagens</h2></div>
      <div class="grid2"><label class="f">Modelo<select class="in" id="msg-modelo">${modelosTodos().map(x => `<option value="${x.id}" ${x.id === msgModelo ? 'selected' : ''}>${esc(x.titulo)} · ${esc(x.cat)}${x.id.startsWith('b') && x.id.length < 4 ? '' : ' (seu)'}</option>`).join('')}</select></label>
      <label class="f">Para quem<select class="in" id="msg-publico">${Object.entries(PUBLICOS).map(([k, l]) => `<option value="${k}" ${k === msgPublico ? 'selected' : ''}>${l}</option>`).join('')}</select></label></div>
      <div class="banner info" style="margin-top:12px"><p class="small" style="white-space:pre-wrap">${esc(preencher(m.texto, {nome:'Maria'}))}</p>${S.modelos.some(x => x.id === m.id) ? `<button class="btn xs" data-act="edit-modelo" data-id="${m.id}">Editar</button>` : `<button class="btn xs" data-act="dup-modelo" data-id="${m.id}">Copiar e editar</button>`}</div>
      <div id="msg-list" style="margin-top:12px"></div>
    </section>
    <section class="panel"><div class="panel-h"><h2>Modelos</h2><span class="hint">Use {nome}, {loja}, {pix}, {instagram}, {data}</span></div>
      <div class="rows">${modelosTodos().map(x => `<div class="row click" data-modelo="${x.id}"><div class="grow"><b>${esc(x.titulo)}</b><span>${esc(x.texto)}</span></div><span class="chip">${esc(x.cat)}</span></div>`).join('')}</div></section>
  </div>`;
}
function renderMsgList(){
  const el = $('#msg-list'); if (!el) return;
  const m = modeloPor(msgModelo), list = publico(msgPublico);
  el.innerHTML = `<p class="muted small" style="margin:0 0 6px">${list.length} pessoa${list.length === 1 ? '' : 's'} com WhatsApp neste grupo. ${enviados.size ? `<b>${[...enviados].filter(k => k.startsWith(msgModelo + '|')).length} enviadas agora.</b>` : ''}</p>
  <div class="rows">${list.map(x => { const key = msgModelo + '|' + x.whatsapp, ok = enviados.has(key), txt = preencher(m.texto, x);
    return `<div class="row"><div class="grow"><b>${esc(x.nome)}</b><span class="mono">${esc(x.whatsapp)}</span></div>${ok ? '<span class="chip c-ok">Enviada</span>' : ''}<a class="btn sm ${ok ? '' : 'primary'}" href="${esc(waLink(x.whatsapp, txt))}" target="_blank" rel="noopener" data-send="${esc(key)}" data-ref="${esc(JSON.stringify(x.ref))}" data-tit="${esc(m.titulo)}">Abrir WhatsApp</a></div>`; }).join('') || '<div class="empty">Ninguém neste grupo tem WhatsApp cadastrado.</div>'}</div>
  <p class="hint" style="margin:10px 0 0">Ao abrir o WhatsApp, o envio fica registrado em Atendimentos. Envie aos poucos para o WhatsApp não bloquear o número.</p>`;
}

/* ================= CLIENTES ================= */
let qCli = '';
function clientes(){
  return `${head('Relacionamento', 'Clientes', '', `<button class="btn primary" data-act="edit-cliente">${I.novo} Cliente</button>`)}
  <div class="toolbar"><input class="in" id="q-cli" placeholder="Buscar por nome, telefone, cidade ou segmento" value="${esc(qCli)}"><span class="muted small">${S.clientes.length} cliente${S.clientes.length === 1 ? '' : 's'}</span></div>
  <div id="cli-list">${cliTable()}</div>`;
}
function cliStats(c){
  const ps = S.pedidos.filter(p => p.clienteId === c.id && isVenda(p));
  return {n: ps.length, tot: sum(ps, p => calc(p).total), ult: ps.map(p => dayOf(p.criadoEm)).sort().pop(), saldo: sum(ps, p => calc(p).saldo)};
}
function cliTable(){
  const q = qCli.trim().toLowerCase(), d90 = addDays(today(), -90);
  const list = S.clientes.filter(c => !q || (c.nome + ' ' + c.whatsapp + ' ' + c.cidade + ' ' + (c.segmento || '')).toLowerCase().includes(q)).map(c => ({...c, ...cliStats(c)})).sort((a, b) => b.tot - a.tot);
  if (!list.length) return `<div class="panel empty">${S.clientes.length ? 'Nenhum cliente encontrado.' : 'Nenhum cliente ainda. Cadastre o primeiro pelo botão acima.'}</div>`;
  return `<div class="tbl-wrap"><table><thead><tr><th>Cliente</th><th>WhatsApp</th><th>Segmento</th><th>Cidade</th><th class="r">Pedidos</th><th class="r">Total comprado</th><th class="r">Deve</th><th class="r">Último pedido</th></tr></thead><tbody>
  ${list.map((c, i) => `<tr class="click" data-cli="${c.id}"><td><b>${esc(c.nome)}</b>${i < 3 && c.tot > 0 && !q ? ' <span class="chip c-acc">Top</span>' : ''}${c.ult && c.ult < d90 ? ' <span class="chip c-warn">Sumido</span>' : ''}${c.obs ? `<span class="sub">${esc(c.obs)}</span>` : ''}</td><td class="mono">${esc(c.whatsapp || '—')}</td><td>${esc(c.segmento || '—')}</td><td>${esc(c.cidade || '—')}</td><td class="r num">${c.n}</td><td class="r num">${brl(c.tot)}</td><td class="r num" style="color:${c.saldo > 0.009 ? 'var(--warn)' : 'var(--muted)'}">${c.saldo > 0.009 ? brl(c.saldo) : '—'}</td><td class="r">${c.ult ? dmy(c.ult) : '—'}</td></tr>`).join('')}
  </tbody></table></div>`;
}

  <div class="modal-b">
    <div class="grid2"><label class="f">Nome<input class="in" id="fc-nome" value="${esc(c.nome)}" placeholder="Nome ou empresa"></label>
    <label class="f">Segmento<select class="in" id="fc-seg">${SEGMENTOS.map(s => `<option ${s === c.segmento ? 'selected' : ''}>${s}</option>`).join('')}</select></label></div>
    <div class="grid2"><label class="f">WhatsApp<input class="in" id="fc-wa" inputmode="tel" value="${esc(c.whatsapp)}" placeholder="(11) 99999-9999"></label>
    <label class="f">Cidade<input class="in" id="fc-cid" value="${esc(c.cidade)}"></label></div>
    <div class="grid2"><label class="f">Aniversário<input class="in" id="fc-aniv" value="${/^\d\d-\d\d$/.test(c.aniversario || '') ? c.aniversario.slice(3) + '/' + c.aniversario.slice(0, 2) : ''}" placeholder="dd/mm"><span class="hint">Lembramos você no painel para mandar parabéns.</span></label>
    <label class="f">Endereço de entrega<input class="in" id="fc-end" value="${esc(c.endereco || '')}"></label></div>
    <label class="f">Observações<input class="in" id="fc-obs" value="${esc(c.obs)}" placeholder="Preferências, datas importantes…"></label>
    ${hist.length ? `<div class="sec"><span class="eyebrow">Pedidos</span><div class="rows">${hist.map(p => `<div class="row click" data-pedido="${p.id}"><span class="mono muted">#${p.numero}</span><div class="grow"><span>${esc(p.itens.map(i => i.qtd + '× ' + i.nome).join(', '))}</span></div>${chip(p.status)}<span class="num">${brl(calc(p).total)}</span></div>`).join('')}</div></div>` : ''}
    ${id ? `<div class="sec"><div class="sec-h"><span class="eyebrow">Atendimentos</span><button class="btn xs" data-act="novo-att" data-cli="${id}">${I.novo} Registrar</button></div><div class="rows">${atts.map(a => `<div class="row click" data-att="${a.id}"><span class="mono muted small">${dmy(dayOf(a.data))}</span><div class="grow"><b>${esc(a.assunto)}</b><span>${esc(a.descricao || '')}</span></div><span class="chip">${esc(a.canal)}</span></div>`).join('') || '<span class="hint">Nenhum atendimento registrado.</span>'}</div></div>` : ''}
  </div>
  <div class="modal-f">${id ? `<div class="r"><button class="btn danger" data-act="del-cliente" data-id="${id}">Excluir</button><button class="btn" data-act="novo-para" data-id="${id}">Novo pedido</button></div>` : '<span></span>'}<div class="r">${c.whatsapp ? `<a class="btn" href="${esc(waLink(c.whatsapp))}" target="_blank" rel="noopener">WhatsApp</a>` : ''}<button class="btn primary" data-act="save-cliente" data-id="${id || ''}" data-quick="${quick ? 1 : ''}">Salvar cliente</button></div></div>`);
  $('#fc-nome').focus();
}

/* ================= PRODUTOS, INSUMOS & SERVIÇOS ================= */
let prodTab = 'produtos';
const vendidosDe = id => sum(S.pedidos.filter(isVenda), o => sum(o.itens.filter(i => i.produtoId === id), i => i.qtd));
function produtos(){
  const ni = alertas().insumos;
  const tabs = tabsHtml('prod', prodTab, [['produtos','Produtos à venda'],['insumos', `Insumos e matéria-prima${ni ? ` (${ni} para repor)` : ''}`]]);
  if (prodTab === 'insumos') {
    const low = i => num(i.qtd) <= num(i.minimo);
    const list = [...S.insumos].sort((a, b) => (low(a) ? 0 : 1) - (low(b) ? 0 : 1) || a.nome.localeCompare(b.nome));
    return `${head('Catálogo', 'Insumos', 'Canecas brancas, papel, tinta, camisetas lisas. Avisamos quando chegar no mínimo.', `<button class="btn primary" data-act="edit-insumo">${I.novo} Insumo</button>`)}
    ${tabs}
    ${list.length ? `<p class="muted small" style="margin:0">Valor parado em estoque: <b class="num">${brl(sum(S.insumos, i => num(i.qtd) * num(i.custo)))}</b></p><div class="tbl-wrap"><table><thead><tr><th>Insumo</th><th class="r">Quantidade</th><th class="r">Mínimo</th><th class="r">Custo unit.</th><th>Situação</th><th class="r">Ajustar</th></tr></thead><tbody>
    ${list.map(i => `<tr class="click" data-ins="${i.id}"><td><b>${esc(i.nome)}</b></td><td class="r num">${num(i.qtd)} <span class="muted">${esc(i.unidade || '')}</span></td><td class="r num muted">${num(i.minimo)}</td><td class="r num">${brl(i.custo)}</td><td>${low(i) ? '<span class="chip c-bad">Repor</span>' : '<span class="chip c-ok">OK</span>'}</td><td class="r"><button class="btn xs" data-act="ins-q" data-id="${i.id}" data-d="-1" aria-label="Usar 1">−1</button> <button class="btn xs" data-act="ins-q" data-id="${i.id}" data-d="1" aria-label="Adicionar 1">+1</button></td></tr>`).join('')}
    </tbody></table></div>` : `<div class="panel empty">Nenhum insumo cadastrado. Cadastre o que você compra para produzir e controle a reposição.</div>`}`;
  }
  const list = S.produtos.filter(p => !isServ(p)).sort((a, b) => (a.categoria || '').localeCompare(b.categoria || '') || a.nome.localeCompare(b.nome));
  return `${head('Catálogo', 'Produtos', 'Custo e preço de venda. A margem mostra quanto sobra de cada real vendido.', `<button class="btn primary" data-act="edit-produto">${I.novo} Produto</button>`)}
  ${tabs}
  ${S.produtos.length ? '' : welcome()}
  ${list.length ? `<div class="tbl-wrap"><table><thead><tr><th>Produto</th><th>Categoria</th><th class="r">Custo</th><th class="r">Preço</th><th class="r">Margem</th><th class="r">Estoque</th><th class="r">Prazo</th><th class="r">Vendidos</th></tr></thead><tbody>
  ${list.map(p => { const m = p.preco ? (p.preco - p.custo) / p.preco * 100 : 0;
    return `<tr class="click" data-prod="${p.id}"><td><b>${esc(p.nome)}</b></td><td>${esc(p.categoria || '—')}</td><td class="r num">${brl(p.custo)}</td><td class="r num">${brl(p.preco)}</td><td class="r"><span class="chip ${m < 40 ? 'c-bad' : m < 55 ? 'c-warn' : 'c-ok'}">${m.toFixed(0)}%</span></td><td class="r num" style="${num(p.estoque) <= 5 ? 'color:var(--bad);font-weight:700' : ''}">${num(p.estoque)}</td><td class="r">${num(p.prazoDias)} dias</td><td class="r num">${vendidosDe(p.id)}</td></tr>`; }).join('')}
  </tbody></table></div>` : ''}`;
}
function servicos(){
  const list = S.produtos.filter(isServ).sort((a, b) => (a.categoria || '').localeCompare(b.categoria || '') || a.nome.localeCompare(b.nome));
  const receita = sum(S.pedidos.filter(isVenda), o => sum(o.itens.filter(i => isServ(produto(i.produtoId))), i => i.qtd * i.preco));
  return `${head('Catálogo', 'Serviços', 'Criação de arte, vetorização, aplicação em peça do cliente, urgência. Não controlam estoque e entram no pedido como os produtos.', `<button class="btn primary" data-act="edit-servico">${I.novo} Serviço</button>`)}
  <div class="kpis">${kpi('Serviços cadastrados', list.length, '', 'hl')}${kpi('Receita com serviços', brl(receita), 'todo o período')}${kpi('Mais vendido', esc(list.slice().sort((a, b) => vendidosDe(b.id) - vendidosDe(a.id))[0]?.nome || '—'), '')}${kpi('Valor médio da hora', brl(sum(list.filter(s => num(s.horas)), s => (s.preco - s.custo) / num(s.horas)) / (list.filter(s => num(s.horas)).length || 1)), 'lucro do serviço ÷ horas')}</div>
  ${list.length ? `<div class="tbl-wrap"><table><thead><tr><th>Serviço</th><th>Categoria</th><th class="r">Preço</th><th class="r">Custo</th><th class="r">Tempo</th><th class="r">Seu valor/hora</th><th class="r">Prazo</th><th class="r">Vendidos</th></tr></thead><tbody>
  ${list.map(s => { const vh = num(s.horas) ? (s.preco - s.custo) / num(s.horas) : 0;
    return `<tr class="click" data-prod="${s.id}"><td><b>${esc(s.nome)}</b></td><td>${esc(s.categoria || '—')}</td><td class="r num">${brl(s.preco)}</td><td class="r num">${brl(s.custo)}</td><td class="r num">${num(s.horas) ? String(num(s.horas)).replace('.', ',') + ' h' : '—'}</td><td class="r num">${vh ? `<span class="chip ${vh < 25 ? 'c-bad' : vh < 50 ? 'c-warn' : 'c-ok'}">${brl(vh)}</span>` : '—'}</td><td class="r">${num(s.prazoDias) ? num(s.prazoDias) + ' dias' : 'na hora'}</td><td class="r num">${vendidosDe(s.id)}</td></tr>`; }).join('')}
  </tbody></table></div>` : `<div class="panel empty">Nenhum serviço cadastrado. Exemplos: criação de arte, vetorização de logo, sublimação em peça do cliente, taxa de urgência.</div>`}`;
}

  $('#f-prod').addEventListener('input', upd); upd(); $('#fp-nome').focus();

/* ================= CAIXA E DESPESAS ================= */

        <label class="f">Categoria<select class="in" id="dp-cat">${CAT_DESP.map(c => `<option>${c}</option>`).join('')}</select></label>

      </div>
    </section>
    <div class="cols">
      <section class="panel"><div class="panel-h"><h2>Despesas de ${mesNome(finMes)}</h2><b class="num neg">${brl(f.totDesp)}</b></div>
        <div class="rows">${[...f.desp].sort((a, b) => b.data.localeCompare(a.data)).map(d => `<div class="row"><span class="mono muted small">${dmy(d.data)}</span><div class="grow"><b>${esc(d.descricao)}</b><span>${esc(d.categoria)} · ${esc(d.pagoCom || PAGO_COM[0])}</span></div><span class="num">${brl(d.valor)}</span><button class="btn ghost sm" data-act="del-desp" data-id="${d.id}" aria-label="Excluir despesa">×</button></div>`).join('') || `<div class="empty">Nenhuma despesa lançada neste mês.</div>`}</div></section>
      <section class="panel"><div class="panel-h"><h2>Por categoria</h2></div>
        <div class="rows">${porCat.map(([c, v]) => barRow(esc(c), `<b class="num">${brl(v)}</b>`, v / porCat[0][1], 'var(--bad)')).join('') || `<div class="empty">Sem despesas no mês.</div>`}</div></section>
    </div>`;
  }
  const porForma = [...new Set(f.pags.map(x => x.forma))].map(fm => { const ps = f.pags.filter(x => x.forma === fm); return [fm, sum(ps, x => num(x.valor)), sum(ps, taxaPag), ps.length]; }).sort((a, b) => b[1] - a[1]);
  const pend = S.pedidos.filter(p => isVenda(p) && calc(p).saldo > 0.009).sort((a, b) => (a.entrega || '').localeCompare(b.entrega || ''));

    ${kpi('Despesas', brl(f.totDesp + f.prolabore), `${f.desp.length} lançamentos${f.prolabore ? ' + pró-labore' : ''}`, '', 'color:var(--bad)')}
    ${kpi('Lucro líquido', brl(f.lucro), `Margem de ${f.liqRec ? (f.lucro / f.liqRec * 100).toFixed(0) : 0}% · <a href="#" data-go="dre" style="color:inherit">ver DRE</a>`, '', `color:${f.lucro >= 0 ? 'var(--ok)' : 'var(--bad)'}`)}
